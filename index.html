<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumen Fidei — A Catholic Repository</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#e9ddc0;
    --parchment-light:#f6f0dc;
    --parchment-dark:#dccfa9;
    --ink:#2a2118;
    --ink-soft:#5a4d3c;
    --wine:#7a2426;
    --wine-dark:#5c1a1c;
    --gold:#a6824a;
    --gold-light:#c7a565;
    --green:#3f5443;
    --indigo:#33415a;
    --purple:#5b4a72;
    --line: rgba(42,33,24,0.18);
    --shadow: 0 2px 14px rgba(42,33,24,0.18);
    --radius: 3px;
  }

  *{box-sizing:border-box;}

  html{scroll-behavior:smooth;}

  body{
    margin:0;
    background:
      radial-gradient(ellipse at top, rgba(255,255,255,0.15), transparent 60%),
      radial-gradient(ellipse at bottom, rgba(0,0,0,0.08), transparent 65%),
      var(--parchment);
    color:var(--ink);
    font-family:'Source Serif 4', Georgia, serif;
    line-height:1.5;
    min-height:100vh;
  }

  h1,h2,h3, .display{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-weight:600;
    color:var(--ink);
    margin:0;
  }

  a{color:var(--wine-dark);}

  ::selection{background:var(--gold-light); color:var(--ink);}

  /* ---------- Masthead ---------- */
  header.masthead{
    text-align:center;
    padding:52px 20px 30px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, var(--parchment-light), transparent);
  }
  header.masthead .mark{
    width:34px; height:34px; margin:0 auto 14px;
    color:var(--wine);
  }
  header.masthead h1{
    font-size:clamp(2.4rem, 5vw, 3.6rem);
    letter-spacing:0.01em;
  }
  header.masthead p.tagline{
    margin:10px auto 0;
    max-width:520px;
    color:var(--ink-soft);
    font-style:italic;
    font-size:1.05rem;
  }
  .rule{
    width:120px; height:1px; margin:18px auto 0;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .searchbar{
    max-width:460px; margin:26px auto 0; display:flex; gap:0;
    border:1px solid var(--ink); background:var(--parchment-light);
  }
  .searchbar input{
    flex:1; border:none; background:transparent; padding:11px 14px;
    font-family:'Source Serif 4', serif; font-size:0.98rem; color:var(--ink);
    outline:none;
  }
  .searchbar input::placeholder{color:var(--ink-soft); opacity:0.75;}
  .searchbar button{
    border:none; border-left:1px solid var(--ink); background:var(--ink);
    color:var(--parchment-light); padding:0 18px; cursor:pointer;
    font-family:'Source Serif 4', serif; font-size:0.92rem;
  }
  .searchbar button:hover{background:var(--wine-dark);}

  /* ---------- Layout ---------- */
  .layout{
    max-width:1180px; margin:0 auto; padding:36px 24px 90px;
    display:grid; grid-template-columns:220px 1fr; gap:44px;
    align-items:start;
  }
  @media (max-width:820px){
    .layout{grid-template-columns:1fr; padding-top:22px;}
  }

  nav.sidebar{position:sticky; top:20px;}
  @media (max-width:820px){nav.sidebar{position:static;}}

  nav.sidebar .group-label{
    font-size:0.78rem; color:var(--ink-soft); margin-bottom:10px; letter-spacing:0.02em;
  }
  nav.sidebar ul{list-style:none; margin:0 0 26px; padding:0;}
  nav.sidebar li{margin:0;}
  nav.sidebar button.navlink{
    width:100%; text-align:left; background:none; border:none; cursor:pointer;
    font-family:'Source Serif 4', serif; font-size:1.05rem; color:var(--ink);
    padding:9px 0 9px 14px; border-left:3px solid transparent;
    display:flex; justify-content:space-between; gap:8px;
  }
  nav.sidebar button.navlink .count{color:var(--ink-soft); font-size:0.88rem;}
  nav.sidebar button.navlink:hover{color:var(--wine-dark);}
  nav.sidebar button.navlink.active{
    border-left-color:var(--cat-color, var(--wine)); color:var(--ink); font-weight:600;
  }
  nav.sidebar button.navlink[data-cat="prayer"]{--cat-color:var(--wine);}
  nav.sidebar button.navlink[data-cat="saint"]{--cat-color:var(--gold);}
  nav.sidebar button.navlink[data-cat="history"]{--cat-color:var(--green);}
  nav.sidebar button.navlink[data-cat="book"]{--cat-color:var(--indigo);}
  nav.sidebar button.navlink[data-cat="calendar"]{--cat-color:var(--purple);}
  
  nav.sidebar button.navlink[data-cat="rosary"]{--cat-color:var(--gold-light);}
  nav.sidebar button.navlink[data-cat="bible"]{--cat-color:var(--indigo);}nav.sidebar button.navlink[data-cat="all"]{--cat-color:var(--ink);}

  .side-actions{border-top:1px solid var(--line); padding-top:18px; display:flex; flex-direction:column; gap:8px;}
  .btn{
    font-family:'Source Serif 4', serif; font-size:0.92rem; cursor:pointer;
    border:1px solid var(--ink); background:transparent; color:var(--ink);
    padding:9px 14px; border-radius:var(--radius); text-align:left;
  }
  .btn:hover{background:var(--ink); color:var(--parchment-light);}
  .btn.primary{background:var(--wine); border-color:var(--wine); color:var(--parchment-light);}
  .btn.primary:hover{background:var(--wine-dark); border-color:var(--wine-dark);}
  .btn.quiet{border-color:var(--line); color:var(--ink-soft); font-size:0.85rem;}
  .btn.danger:hover{background:var(--wine-dark); border-color:var(--wine-dark);}
  input[type=file]{display:none;}

  /* ---------- Main ---------- */
  main{min-width:0;}
  .main-head{
    display:flex; justify-content:space-between; align-items:flex-end;
    gap:16px; margin-bottom:6px; flex-wrap:wrap;
  }
  .main-head h2{font-size:2rem;}
  .main-head p.desc{color:var(--ink-soft); margin-top:4px; max-width:60ch;}

  .entry-list{margin-top:22px;}
  .entry-row{
    padding:18px 0 18px 18px;
    border-bottom:1px solid var(--line);
    border-left:3px solid var(--row-color, var(--wine));
    cursor:pointer;
  }
  .entry-row:hover{background:rgba(166,130,74,0.08);}
  .entry-row .row-top{display:flex; justify-content:space-between; gap:14px; align-items:baseline;}
  .entry-row h3{font-size:1.36rem;}
  .entry-row .cat-badge{
    font-size:0.72rem; color:var(--ink-soft); white-space:nowrap; padding-top:4px;
  }
  .entry-row .byline{color:var(--ink-soft); font-style:italic; font-size:0.92rem; margin-top:2px;}
  .entry-row .excerpt{margin-top:8px; color:var(--ink); opacity:0.86; font-size:0.97rem;}
  .entry-row .tags{margin-top:10px; display:flex; gap:6px; flex-wrap:wrap;}
  .tag{
    font-size:0.76rem; color:var(--ink-soft); background:rgba(42,33,24,0.06);
    padding:2px 8px; border-radius:2px;
  }

  .empty-state{
    border:1px dashed var(--line); padding:40px 24px; text-align:center;
    color:var(--ink-soft); margin-top:24px; border-radius:var(--radius);
  }
  .empty-state .btn{display:inline-block; margin-top:14px;}

  /* ---------- Calendar ---------- */
  .cal-legend{
    display:flex; flex-wrap:wrap; gap:16px; margin:20px 0 8px;
    padding:14px 16px; border:1px solid var(--line); background:rgba(42,33,24,0.03);
  }
  .cal-legend .item{display:flex; align-items:center; gap:7px; font-size:0.85rem; color:var(--ink-soft);}
  .cal-legend .dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}

  .month-group{margin-top:30px;}
  .month-group h3{
    font-size:1.5rem; color:var(--wine-dark); border-bottom:1px solid var(--gold-light);
    padding-bottom:6px; margin-bottom:4px;
  }
  .cal-row{
    display:flex; gap:14px; padding:12px 0 12px 4px;
    border-bottom:1px solid var(--line); cursor:default;
  }
  .cal-date{
    flex:0 0 64px; font-size:0.92rem; color:var(--ink-soft); padding-top:2px;
  }
  .cal-dot{
    flex:0 0 9px; height:9px; width:9px; border-radius:50%;
    margin-top:8px; background:var(--row-color, var(--wine));
  }
  .cal-body{flex:1; min-width:0;}
  .cal-body .cal-top{display:flex; justify-content:space-between; gap:12px; align-items:baseline; flex-wrap:wrap;}
  .cal-name{font-family:'Cormorant Garamond', serif; font-weight:600; font-size:1.2rem;}
  .cal-type{font-size:0.74rem; color:var(--ink-soft); white-space:nowrap;}
  .cal-note{font-size:0.92rem; color:var(--ink); opacity:0.85; margin-top:3px;}

  .intercession-block{
    margin-top:26px; padding-top:20px; border-top:1px solid var(--line);
  }
  .intercession-block h3{
    font-size:1.05rem; color:var(--wine-dark); margin-bottom:10px; font-weight:600;
  }
  .intercession-block p{
    font-style:italic; line-height:1.75; margin:0;
  }

  footer{
    text-align:center; padding:30px 20px 50px; color:var(--ink-soft); font-size:0.85rem;
  }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,15,10,0.55);
    display:none; align-items:flex-start; justify-content:center;
    padding:40px 16px; overflow-y:auto; z-index:50;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--parchment-light); max-width:640px; width:100%;
    border:1px solid var(--ink); box-shadow:var(--shadow);
    padding:32px 32px 26px;
  }
  .modal-head{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:18px;}
  .modal-head h2{font-size:1.7rem;}
  .modal-close{background:none; border:none; font-size:1.4rem; cursor:pointer; color:var(--ink-soft); line-height:1;}
  .modal-close:hover{color:var(--wine);}

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:0.85rem; color:var(--ink-soft); margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%; font-family:'Source Serif 4', serif; font-size:0.98rem;
    border:1px solid var(--line); background:var(--parchment); color:var(--ink);
    padding:9px 11px; border-radius:var(--radius);
  }
  .field textarea{min-height:170px; resize:vertical; line-height:1.55;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:520px){.field-row{grid-template-columns:1fr;}}
  .field .hint{font-size:0.78rem; color:var(--ink-soft); margin-top:4px;}

  .modal-actions{display:flex; justify-content:space-between; align-items:center; margin-top:22px; gap:10px; flex-wrap:wrap;}
  .modal-actions .left{display:flex; gap:10px;}

  /* ---------- Reading modal ---------- */
  .read-modal{max-width:680px;}
  .read-modal .read-cat{font-size:0.8rem; color:var(--ink-soft); margin-bottom:6px;}
  .read-modal h2{font-size:2rem; margin-bottom:4px;}
  .read-modal .byline{font-style:italic; color:var(--ink-soft); margin-bottom:18px;}
  .read-modal .body-text{font-size:1.05rem; line-height:1.75;}
  .read-modal .body-text p{margin:0 0 1em;}
  .read-modal .body-text p:first-of-type:first-letter{
    font-family:'Cormorant Garamond', serif; font-size:2.6em; float:left; line-height:0.8;
    padding-right:8px; padding-top:6px; color:var(--wine-dark); font-weight:700;
  }
  .read-modal .link-box{margin-top:16px; font-size:0.92rem;}
  .read-modal .tags{margin-top:20px; display:flex; gap:6px; flex-wrap:wrap;}
  .read-actions{display:flex; gap:10px; margin-top:26px; border-top:1px solid var(--line); padding-top:18px;}

  @media (max-width:600px){
    .modal{padding:24px 18px 20px;}
  }

  /* Rosary & Bible CSS */
  .rosary-container{max-width:700px;margin:0 auto;padding:20px;text-align:center;}
  .rosary-crucifix{width:60px;height:100px;margin:0 auto 30px;color:var(--wine-dark);cursor:pointer;}
  .rosary-beads{display:flex;flex-direction:column;align-items:center;gap:15px;margin:30px 0;}
  .bead-row{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;}
  .bead{width:45px;height:45px;border-radius:50%;background:var(--gold-light);border:2px solid var(--gold-dark);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond', serif;font-size:0.9rem;color:var(--ink);cursor:pointer;transition:all 0.2s;}
  .bead:hover{background:var(--gold);transform:scale(1.1);}
  .bead.active{background:var(--wine);border-color:var(--wine-dark);color:white;}
  .bead.center{width:70px;height:70px;font-size:1.3rem;background:linear-gradient(135deg, var(--wine), var(--gold));border:3px solid var(--wine-dark);margin:20px 0;}
  .rosary-controls{display:flex;justify-content:center;gap:15px;margin:30px 0;flex-wrap:wrap;}
  .rosary-btn{padding:10px 20px;background:var(--wine);color:white;border:none;border-radius:var(--radius);cursor:pointer;font-family:'Source Serif 4', serif;font-size:0.95rem;}
  .rosary-btn:hover{background:var(--wine-dark);}
  .rosary-btn.secondary{background:var(--gold-light);color:var(--ink);}
  .rosary-prayer-display{background:var(--parchment);border:1px solid var(--line);padding:20px;margin:20px 0;border-radius:var(--radius);min-height:100px;text-align:left;}
  .rosary-prayer-text{font-size:1.1rem;line-height:1.7;color:var(--ink);font-style:italic;}
  .rosary-counter{display:flex;justify-content:center;gap:20px;margin:20px 0;font-family:'Cormorant Garamond', serif;}
  .counter-box{background:var(--parchment-light);border:1px solid var(--gold);padding:10px 20px;border-radius:var(--radius);min-width:120px;}
  .counter-label{font-size:0.8rem;color:var(--ink-soft);margin-bottom:5px;}
  .counter-value{font-size:1.5rem;color:var(--wine-dark);}
  .rosary-mysteries{display:grid;grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));gap:20px;margin:30px 0;}
  .mystery-card{background:var(--parchment-light);border:1px solid var(--line);padding:15px;border-radius:var(--radius);cursor:pointer;}
  .mystery-card:hover{border-color:var(--wine);background:rgba(122,36,38,0.05);}
  .mystery-card.active{border-color:var(--wine);background:rgba(122,36,38,0.1);}
  .mystery-title{font-weight:600;color:var(--wine-dark);margin-bottom:8px;}
  .mystery-fruit{font-size:0.85rem;color:var(--ink-soft);font-style:italic;}
  .bible-browser{max-width:900px;margin:0 auto;}
  .bible-toolbar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center;}
  .bible-select{padding:10px 14px;border:1px solid var(--line);background:var(--parchment-light);color:var(--ink);font-family:'Source Serif 4', serif;font-size:0.95rem;border-radius:var(--radius);cursor:pointer;}
  .bible-select:focus{outline:none;border-color:var(--wine);}
  .bible-chapter-nav{display:flex;gap:10px;align-items:center;}
  .bible-btn-nav{padding:8px 16px;background:var(--wine);color:white;border:none;border-radius:var(--radius);cursor:pointer;font-family:'Source Serif 4', serif;}
  .bible-btn-nav:hover{background:var(--wine-dark);}
  .bible-reference{text-align:center;margin:20px 0;font-family:'Cormorant Garamond', serif;font-size:1.2rem;color:var(--wine-dark);}
  .bible-chapter-content{background:var(--parchment-light);border:1px solid var(--line);padding:25px;border-radius:var(--radius);line-height:1.8;}
  .bible-verse{margin-bottom:15px;padding-left:10px;border-left:2px solid var(--gold-light);}
  .bible-verse-num{color:var(--ink-soft);font-size:0.85rem;margin-right:8px;font-family:'Cormorant Garamond', serif;}
  .bible-text{color:var(--ink);font-size:1.05rem;}
</style>
</head>
<body>

<header class="masthead">
  <svg class="mark" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 2V22M6 6H18" stroke="currentColor" stroke-width="1.4"/>
    <path d="M9 6C9 6 9 3 12 3C15 3 15 6 15 6" stroke="currentColor" stroke-width="1.2"/>
  </svg>
  <h1>Lumen Fidei</h1>
  <p class="tagline">A living repository of prayers, saints, history, and the written word of the Church</p>
  <div class="rule"></div>
  <div class="searchbar">
    <input id="searchInput" type="text" placeholder="Search the repository…" autocomplete="off">
    <button id="searchClear">Clear</button>
  </div>
</header>

<div class="layout">
  <nav class="sidebar">
    <div class="group-label">Browse</div>
    <ul id="navList">
      <li><button class="navlink active" data-cat="all">All entries <span class="count" id="count-all"></span></button></li>
      <li><button class="navlink" data-cat="prayer">Prayers <span class="count" id="count-prayer"></span></button></li>
      <li><button class="navlink" data-cat="saint">Saints <span class="count" id="count-saint"></span></button></li>
      <li><button class="navlink" data-cat="history">History <span class="count" id="count-history"></span></button></li>
      <li><button class="navlink" data-cat="book">Books <span class="count" id="count-book"></span></button></li>
      <li><button class="navlink" data-cat="calendar">Calendar <span class="count" id="count-calendar"></span></button></li>
      <li><button class="navlink" data-cat="rosary">Interactive Rosary</button></li>
      <li><button class="navlink" data-cat="bible">Catholic Bible</button></li>
    </ul>
  </nav>

  <main>
    <div class="main-head">
      <div>
        <h2 id="sectionTitle">All entries</h2>
        <p class="desc" id="sectionDesc">Everything currently held in the repository.</p>
      </div>
    </div>
    <div class="entry-list" id="entryList"></div>
  </main>
</div>

<footer>Lumen Fidei — a repository of Catholic prayers, saints, history, and books.</footer>

<!-- Reading modal -->
<div class="overlay" id="readOverlay">
  <div class="modal read-modal">
    <div class="modal-head">
      <div>
        <div class="read-cat" id="readCat"></div>
        <h2 id="readTitle"></h2>
        <div class="byline" id="readByline"></div>
      </div>
      <button class="modal-close" id="readClose">×</button>
    </div>
    <div class="body-text" id="readBody"></div>
    <div class="link-box" id="readLinkBox"></div>
    <div class="tags" id="readTags"></div>
  </div>
</div>

<script>
/* =========================================================
   DATA
   ========================================================= */
const CAT_LABEL = { prayer:'Prayer', saint:'Saint', history:'History', book:'Book', rosary:'Rosary', bible:'Bible' };
const CAT_DESC = {
  all: 'Everything currently held in the repository.',
  prayer: 'Traditional and devotional prayers of the Church.',
  saint: 'Lives, patronages, and prayers of intercession for the saints.',
  history: 'Councils, movements, and turning points in Church history.',
  book: 'Spiritual classics and reference works, with summaries and links.',
  calendar: 'Solemnities, feast days, novenas, and seasons of the liturgical year.',
  rosary: 'Pray the Holy Rosary interactively with guided meditations on the mysteries of Christ.',
  bible: 'Read the complete Catholic Bible with all books and chapters from the Douay-Rheims translation.'
};

const CAL_TYPE_COLOR = {
  Solemnity:'var(--gold)', Feast:'var(--green)', Memorial:'var(--indigo)',
  Season:'var(--purple)', Novena:'var(--wine)'
};

const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

const SEED_DATA = [
  { id:'p1', category:'prayer', title:'The Sign of the Cross', author:'', tags:['traditional','daily'],
    content:'In the name of the Father, and of the Son, and of the Holy Spirit. Amen.' },
  { id:'p2', category:'prayer', title:'The Lord\u2019s Prayer (Our Father)', author:'Given by Christ, Matthew 6:9\u201313', tags:['traditional','daily','scripture'],
    content:'Our Father, who art in heaven, hallowed be Thy name; Thy kingdom come; Thy will be done on earth as it is in heaven. Give us this day our daily bread; and forgive us our trespasses as we forgive those who trespass against us; and lead us not into temptation, but deliver us from evil. Amen.' },
  { id:'p3', category:'prayer', title:'Hail Mary', author:'', tags:['marian','traditional','daily'],
    content:'Hail Mary, full of grace, the Lord is with thee. Blessed art thou amongst women, and blessed is the fruit of thy womb, Jesus.\n\nHoly Mary, Mother of God, pray for us sinners, now and at the hour of our death. Amen.' },
  { id:'p4', category:'prayer', title:'Glory Be (Doxology)', author:'', tags:['traditional','daily','rosary'],
    content:'Glory be to the Father, and to the Son, and to the Holy Spirit. As it was in the beginning, is now, and ever shall be, world without end. Amen.' },
  { id:'p5', category:'prayer', title:'The Apostles\u2019 Creed', author:'', tags:['creed','traditional'],
    content:'I believe in God, the Father almighty, Creator of heaven and earth, and in Jesus Christ, his only Son, our Lord, who was conceived by the Holy Spirit, born of the Virgin Mary, suffered under Pontius Pilate, was crucified, died and was buried; he descended into hell; on the third day he rose again from the dead; he ascended into heaven, and is seated at the right hand of God the Father almighty; from there he will come to judge the living and the dead.\n\nI believe in the Holy Spirit, the holy catholic Church, the communion of saints, the forgiveness of sins, the resurrection of the body, and life everlasting. Amen.' },
  { id:'p6', category:'prayer', title:'Act of Contrition', author:'', tags:['confession','penance'],
    content:'O my God, I am heartily sorry for having offended Thee, and I detest all my sins because of Thy just punishments, but most of all because they offend Thee, my God, who art all good and deserving of all my love. I firmly resolve, with the help of Thy grace, to sin no more and to avoid the near occasions of sin. Amen.' },
  { id:'p7', category:'prayer', title:'Memorare', author:'attributed to St. Bernard of Clairvaux', tags:['marian','intercession'],
    content:'Remember, O most gracious Virgin Mary, that never was it known that anyone who fled to thy protection, implored thy help, or sought thy intercession was left unaided.\n\nInspired by this confidence, I fly unto thee, O Virgin of virgins, my Mother; to thee do I come, before thee I stand, sinful and sorrowful. O Mother of the Word Incarnate, despise not my petitions, but in thy mercy hear and answer me. Amen.' },
  { id:'p8', category:'prayer', title:'Prayer to St. Michael the Archangel', author:'Pope Leo XIII', tags:['protection','angels'],
    content:'St. Michael the Archangel, defend us in battle. Be our protection against the wickedness and snares of the devil. May God rebuke him, we humbly pray; and do thou, O Prince of the heavenly host, by the power of God, cast into hell Satan and all the evil spirits who prowl about the world seeking the ruin of souls. Amen.' },
  { id:'p9', category:'prayer', title:'The Angelus', author:'', tags:['marian','incarnation'],
    content:'V. The Angel of the Lord declared unto Mary. R. And she conceived of the Holy Spirit. Hail Mary...\n\nV. Behold the handmaid of the Lord. R. Be it done unto me according to thy word. Hail Mary...\n\nV. And the Word was made flesh. R. And dwelt among us. Hail Mary...\n\nV. Pray for us, O holy Mother of God. R. That we may be made worthy of the promises of Christ.\n\nLet us pray: Pour forth, we beseech Thee, O Lord, Thy grace into our hearts, that we, to whom the incarnation of Christ, Thy Son, was made known by the message of an angel, may by His passion and cross be brought to the glory of His resurrection. Through the same Christ our Lord. Amen.' },

  { id:'s1', category:'saint', title:'St. Francis of Assisi', author:'1181\u20131226, feast day October 4', tags:['founder','poverty','nature'],
    content:'Born to a wealthy cloth merchant in Assisi, Francis abandoned a comfortable life after a series of conversions, embracing radical poverty and founding the Franciscan order. He preached to the poor, rebuilt ruined churches, and is remembered for his tenderness toward creation, famously preaching to birds and taming a wolf in legend.\n\nIn 1224 he is said to have received the stigmata, the wounds of Christ, while praying on Mount La Verna. He died in 1226 and was canonized just two years later. He is the patron saint of animals, ecology, and Italy.',
    intercession:'St. Francis of Assisi, who found God in poverty and in every creature, teach us to hold this world lightly and to love it truly. Pray for us, that we may walk humbly, live simply, and see the hand of the Creator in all things. Amen.' },
  { id:'s2', category:'saint', title:'St. Thérèse of Lisieux', author:'1873\u20131897, feast day October 1', tags:['carmelite','little way','doctor of the church'],
    content:'A French Carmelite nun who died of tuberculosis at twenty-four, Thérèse is known for her "Little Way": the conviction that holiness is found not in grand deeds but in small acts of love done with great fidelity. Her spiritual autobiography, Story of a Soul, was published after her death and became one of the most widely read spiritual works of the modern era.\n\nShe was canonized in 1925 and declared a Doctor of the Church in 1997, one of only a handful of women to hold that title.',
    intercession:'St. Thérèse of Lisieux, Little Flower, who found holiness in life\u2019s smallest acts of love, pray for us. Teach us your Little Way, that we may trust God as a child trusts a father, and offer him even our smallest joys and sufferings. Amen.' },
  { id:'s3', category:'saint', title:'St. Augustine of Hippo', author:'354\u2013430, feast day August 28', tags:['doctor of the church','theology','north africa'],
    content:'Born in North Africa, Augustine spent his youth pursuing worldly ambition and Manichean philosophy before his dramatic conversion to Christianity in 386, recounted in his Confessions. He became Bishop of Hippo and one of the most influential theologians in Christian history, shaping doctrines on grace, original sin, and the nature of the Church.\n\nHis vast body of writing, including The City of God, continues to be foundational to both Catholic and broader Western thought.',
    intercession:'St. Augustine, who searched restlessly before finding peace in God, pray for all who wrestle with doubt and desire. Obtain for us the grace of a sincere conversion, and hearts that find their rest in the Lord alone. Amen.' },
  { id:'s4', category:'saint', title:'St. Thomas Aquinas', author:'1225\u20131274, feast day January 28', tags:['doctor of the church','philosophy','dominican'],
    content:'An Italian Dominican friar and one of the greatest philosopher-theologians of the Middle Ages, Aquinas sought to reconcile faith with the rediscovered philosophy of Aristotle. His masterwork, the Summa Theologica, systematically addresses questions of God, morality, and the sacraments, and remains central to Catholic theological education.\n\nHe is honored as the Angelic Doctor and is the patron saint of students and universities.',
    intercession:'St. Thomas Aquinas, patron of students and scholars, pray for us. Obtain for us a mind eager to seek truth, a will to pursue it honestly, and the grace to hold what we learn always in service of God. Amen.' },
  { id:'s5', category:'saint', title:'St. Teresa of Ávila', author:'1515\u20131582, feast day October 15', tags:['carmelite','mysticism','doctor of the church'],
    content:'A Spanish Carmelite nun and mystic, Teresa reformed her order to return it to stricter contemplative observance, founding the Discalced Carmelites alongside St. John of the Cross. Her writings on prayer and the interior life, especially The Interior Castle, remain classics of Christian mysticism.\n\nShe was declared a Doctor of the Church in 1970, the first woman to receive the title.',
    intercession:'St. Teresa of Ávila, teacher of prayer, pray for us. Help us to persevere through dryness and distraction, and lead us deeper into the interior castle of the soul, where Christ himself dwells. Amen.' },
  { id:'s6', category:'saint', title:'St. Joan of Arc', author:'c. 1412\u20131431, feast day May 30', tags:['france','martyr','visionary'],
    content:'A peasant girl from Domrémy, Joan believed she received visions directing her to support Charles VII and lead French forces during the Hundred Years\u2019 War. She led the army to a decisive victory at Orléans in 1429 but was later captured, tried on charges of heresy by a politically motivated court, and burned at the stake in 1431 at nineteen.\n\nShe was declared innocent by a posthumous retrial in 1456 and canonized in 1920. She is a patron saint of France and of soldiers.',
    intercession:'St. Joan of Arc, who followed God\u2019s call with unshakable courage, pray for us. Give us your boldness in the face of doubt and opposition, and the humility to submit our own certainty to the will of God. Amen.' },

  { id:'s7', category:'saint', title:'St. Peter the Apostle', author:'d. c. 64, feast day June 29', tags:['apostle','pope','martyr'],
    content:'A fisherman from Galilee called by Christ to be the "rock" on which the Church would be built, Peter was the leader of the twelve apostles and, by tradition, the first Bishop of Rome. Despite denying Christ three times during the Passion, he was restored and commissioned to feed Christ\u2019s flock, later leading the early Church through its first difficult decades.\n\nHe was martyred in Rome under Nero, traditionally crucified upside down at his own request, believing himself unworthy to die as Christ did.',
    intercession:'St. Peter, first among the apostles, pray for the Church and for its shepherds. Obtain for us the grace to rise after our failures as you did, and to love Christ enough to follow him even to the end. Amen.' },
  { id:'s8', category:'saint', title:'St. Paul the Apostle', author:'d. c. 64, feast day June 29', tags:['apostle','missionary','martyr'],
    content:'Once a zealous persecutor of Christians known as Saul, Paul was transformed by an encounter with the risen Christ on the road to Damascus. He became the Church\u2019s greatest missionary, founding communities across the Mediterranean and writing letters that form a large part of the New Testament.\n\nHe was martyred in Rome, tradition holds, by beheading, and is honored alongside Peter as a co-founder of the Roman Church.',
    intercession:'St. Paul, apostle to the nations, pray for us. Set our hearts ablaze as yours was on the road to Damascus, and give us courage to proclaim the Gospel in season and out of season. Amen.' },
  { id:'s9', category:'saint', title:'St. John the Apostle', author:'d. c. 100, feast day December 27', tags:['apostle','evangelist','beloved disciple'],
    content:'Known in his own Gospel as "the disciple whom Jesus loved," John was among the first apostles called and was present at the Transfiguration and the Crucifixion, where Christ entrusted his mother Mary to his care. Tradition credits him with the fourth Gospel, three epistles, and the Book of Revelation.\n\nHe is believed to be the only apostle who did not die a martyr\u2019s death, living to old age in Ephesus.',
    intercession:'St. John, beloved disciple, pray for us. Teach us to rest close to the heart of Christ as you did, and to love one another as he has loved us. Amen.' },
  { id:'s10', category:'saint', title:'St. Mary Magdalene', author:'1st century, feast day July 22', tags:['apostle to the apostles','witness','conversion'],
    content:'Delivered by Christ from grave affliction, Mary Magdalene became one of his most devoted followers, present at the crucifixion when many others had fled. She was the first witness of the Resurrection and was sent by the risen Christ to announce the news to the apostles, earning her the title "Apostle to the Apostles."\n\nIn 2016 Pope Francis raised her liturgical feast to the rank celebrated for the apostles, honoring her unique place in salvation history.',
    intercession:'St. Mary Magdalene, first witness of the Resurrection, pray for us. Obtain for us your same faithful love for Christ, and the courage to proclaim the joy of the Gospel to a world still in need of hope. Amen.' },
  { id:'s11', category:'saint', title:'St. Joseph', author:'1st century BC \u2013 1st century AD, feast day March 19', tags:['patron of the church','fatherhood','workers'],
    content:'The husband of Mary and foster father of Jesus, Joseph appears in Scripture only through his actions: obeying angelic messages in dreams, protecting the Holy Family in flight to Egypt, and raising Jesus in the trade of carpentry. Scripture records no words of his at all, only quiet, faithful obedience.\n\nHe is honored as patron of the universal Church, of fathers, of workers, and of a happy death, having died, by tradition, in the presence of Jesus and Mary.',
    intercession:'St. Joseph, silent and faithful guardian, pray for us. Watch over our families as you watched over the Holy Family, and obtain for us the grace of a peaceful death in the company of Jesus and Mary. Amen.' },
  { id:'s12', category:'saint', title:'St. Anne', author:'1st century BC, feast day July 26', tags:['grandparents','mothers','marian'],
    content:'Though not named in Scripture, St. Anne has been honored since the early Church, by tradition, as the mother of the Virgin Mary and grandmother of Jesus. Devotion to her spread widely through the Middle Ages, and she is invoked especially by mothers, grandparents, and those hoping for children.\n\nShe is venerated alongside her husband, St. Joachim, as an example of quiet faithfulness within family life.',
    intercession:'St. Anne, grandmother of our Lord, pray for grandparents and for all who long to pass on the faith to those who come after them. Watch over our families across every generation. Amen.' },
  { id:'s13', category:'saint', title:'St. Benedict of Nursia', author:'c. 480\u2013547, feast day July 11', tags:['monasticism','founder','patron of europe'],
    content:'Born in Nursia, Italy, Benedict withdrew from society as a young man to live as a hermit before founding the monastery of Monte Cassino and writing his famous Rule, which balanced prayer, manual labor, and community life under the motto ora et labora. His moderate, practical approach became the foundation of Western monasticism.\n\nBenedictine houses preserved learning and stability through the upheavals of the early medieval period, earning him the title patron of Europe.',
    intercession:'St. Benedict, father of Western monks, pray for us. Teach us to order our days around prayer and honest work, and to seek God with the same steady discipline you gave to your Rule. Amen.' },
  { id:'s14', category:'saint', title:'St. Patrick', author:'c. 385\u2013461, feast day March 17', tags:['missionary','ireland','bishop'],
    content:'Captured as a teenager from Roman Britain and enslaved in Ireland, Patrick escaped after six years but later returned as a missionary bishop, having felt called in a vision. He is credited with converting much of pagan Ireland to Christianity, founding churches and monasteries across the island.\n\nThe shamrock, by tradition, was his teaching tool for explaining the Trinity, and he remains one of the most beloved patron saints in the world.',
    intercession:'St. Patrick, apostle of Ireland, pray for missionaries and for all who bring the Gospel to unfamiliar and difficult places. Give us your courage to return good for the evil once done to us. Amen.' },
  { id:'s15', category:'saint', title:'St. Anthony of Padua', author:'1195\u20131231, feast day June 13', tags:['franciscan','preacher','lost items'],
    content:'A Portuguese-born Franciscan friar renowned for his preaching and deep knowledge of Scripture, Anthony was declared a Doctor of the Church for the clarity and power of his sermons. He spent much of his ministry in Padua, Italy, known for his charity to the poor and his gift for reconciling enemies.\n\nHe is popularly invoked as the finder of lost items and lost causes, a devotion rooted in a legend of a stolen book miraculously returned.',
    intercession:'St. Anthony of Padua, wonder-worker, pray for us. Help us find what is truly lost — faith grown cold, relationships broken, hope set aside — and restore in us confidence in God\u2019s providence. Amen.' },
  { id:'s16', category:'saint', title:'St. Jude Thaddeus', author:'1st century, feast day October 28', tags:['apostle','desperate causes','martyr'],
    content:'One of the twelve apostles, Jude is traditionally identified as the author of the New Testament epistle bearing his name and is said to have preached the Gospel in Mesopotamia and Persia before being martyred there. Because his name resembled that of the traitor Judas, devotion to him was historically neglected, which by tradition led him to intercede especially readily for those in desperate need.\n\nHe is one of the most widely invoked saints in the Church today, particularly in times of hardship thought to be beyond hope.',
    intercession:'St. Jude, patron of hopeless causes, pray for us. In our most desperate hours, when no other help seems near, obtain for us the grace to trust that nothing is beyond the mercy of God. Amen.' },
  { id:'s17', category:'saint', title:'St. Nicholas of Myra', author:'c. 270\u2013343, feast day December 6', tags:['bishop','generosity','children'],
    content:'A bishop in Asia Minor during the early fourth century, Nicholas became famous for his secret generosity, most notably providing dowries for three poor sisters by tossing gold through their window under cover of night so they would not face destitution. He is said to have attended the Council of Nicaea and defended orthodox teaching on the divinity of Christ.\n\nHis legend of quiet, anonymous gift-giving eventually gave rise to the popular figure of Santa Claus.',
    intercession:'St. Nicholas, generous bishop, pray for us. Teach us to give freely and quietly, seeking no praise, and to care for children and the poor as you once did in Myra. Amen.' },
  { id:'s18', category:'saint', title:'St. George', author:'d. c. 303, feast day April 23', tags:['martyr','soldiers','courage'],
    content:'A soldier in the Roman army, George was martyred under Emperor Diocletian for refusing to renounce his Christian faith, reportedly enduring prolonged torture with steadfast courage before his execution. Little else about his life is reliably documented, but his witness of fidelity under persecution spread rapidly and inspired the popular legend of him slaying a dragon to save a princess, understood as a symbol of his triumph over evil.\n\nHe is a patron saint of soldiers, England, and several other nations.',
    intercession:'St. George, valiant martyr, pray for us. Give us courage to stand firm in our faith when it is tested, and to face evil, whatever form it takes, without losing hope in Christ\u2019s victory. Amen.' },
  { id:'s19', category:'saint', title:'St. Sebastian', author:'d. c. 288, feast day January 20', tags:['martyr','soldiers','athletes'],
    content:'A captain in the Roman imperial guard, Sebastian was discovered to be secretly Christian and, by tradition, was ordered shot with arrows and left for dead. He survived, was nursed back to health, and confronted the emperor directly about the persecution of Christians, for which he was ultimately clubbed to death.\n\nHis survival of the arrows made him a popular subject in art and a patron of soldiers and athletes.',
    intercession:'St. Sebastian, steadfast martyr, pray for us. Give soldiers, athletes, and all who face danger in their work the courage to hold to their faith under pressure and pain. Amen.' },
  { id:'s20', category:'saint', title:'St. Monica', author:'331\u2013387, feast day August 27', tags:['mothers','patience','perseverance'],
    content:'The mother of St. Augustine, Monica spent decades praying for her son\u2019s conversion through years of his wandering into worldly ambition and heterodox belief. Her patience and tears, as Augustine himself recorded, were instrumental in his eventual return to the faith and his baptism.\n\nShe is remembered as a model of persevering prayer for the conversion of loved ones who seem far from God.',
    intercession:'St. Monica, patient mother, pray for us. Hear the prayers of every parent who weeps for a child astray, and obtain for them the same steadfast hope that carried you through years of waiting. Amen.' },
  { id:'s21', category:'saint', title:'St. Jerome', author:'c. 342\u2013420, feast day September 30', tags:['doctor of the church','scripture','translator'],
    content:'A brilliant and famously irritable scholar, Jerome dedicated much of his life to translating the Bible from Hebrew and Greek into Latin, producing the Vulgate, which remained the Church\u2019s standard biblical text for over a thousand years. He lived for decades as a hermit and monk near Bethlehem, immersed in study and controversy alike.\n\nHe is honored as a Doctor of the Church and the patron of biblical scholars and translators.',
    intercession:'St. Jerome, lover of Scripture, pray for us. Give us your hunger for the word of God, and remind us, as you often said, that ignorance of Scripture is ignorance of Christ. Amen.' },
  { id:'s22', category:'saint', title:'St. Ambrose', author:'c. 340\u2013397, feast day December 7', tags:['doctor of the church','bishop','milan'],
    content:'A Roman governor unexpectedly acclaimed bishop of Milan by popular demand while still an unbaptized catechumen, Ambrose became one of the most influential churchmen of his age, instructing Augustine and famously standing up to emperors on matters of Church authority. His eloquent preaching and hymn-writing shaped Western liturgical music.\n\nHe is honored as a Doctor of the Church, remembered for his courage in defending the Church\u2019s independence from imperial power.',
    intercession:'St. Ambrose, fearless bishop, pray for us. Give Church leaders your courage to speak truth to power, and give us all a love for the beauty of the liturgy that you helped shape. Amen.' },
  { id:'s23', category:'saint', title:'St. Ignatius of Loyola', author:'1491\u20131556, feast day July 31', tags:['founder','jesuits','discernment'],
    content:'A Spanish soldier wounded in battle, Ignatius underwent a profound conversion during a long recovery, later founding the Society of Jesus (the Jesuits) to serve the Church through education, missionary work, and spiritual direction. His Spiritual Exercises, a structured method of prayer and discernment, remain widely used today.\n\nHe emphasized finding God "in all things," bringing contemplative depth into active, engaged life in the world.',
    intercession:'St. Ignatius of Loyola, pray for us. Teach us to discern God\u2019s will in the ordinary movements of our hearts, and to seek him not only in prayer but in all our daily work. Amen.' },
  { id:'s24', category:'saint', title:'St. Francis Xavier', author:'1506\u20131552, feast day December 3', tags:['missionary','jesuit','asia'],
    content:'A close companion of St. Ignatius of Loyola and one of the first Jesuits, Francis Xavier became one of history\u2019s most extensive Christian missionaries, traveling across India, Southeast Asia, and Japan to preach the Gospel, reportedly baptizing tens of thousands of converts. He died within sight of mainland China, still hoping to enter it as a missionary.\n\nHe is honored as a patron of foreign missions alongside St. Thérèse of Lisieux.',
    intercession:'St. Francis Xavier, tireless missionary, pray for us. Give missionaries strength for the journey to unfamiliar lands, and set our own hearts on fire to carry Christ to those who have not yet heard of him. Amen.' },
  { id:'s25', category:'saint', title:'St. John Vianney', author:'1786\u20131859, feast day August 4', tags:['priests','confession','patience'],
    content:'Known as the Curé of Ars for the small French parish he served for over forty years, John Vianney struggled academically as a seminarian yet became one of history\u2019s most sought-after confessors, reportedly spending up to sixteen hours a day hearing confessions as pilgrims traveled from across Europe to see him.\n\nHe is the patron saint of parish priests, remembered for his humility, penance, and tireless availability to souls in need.',
    intercession:'St. John Vianney, patron of priests, pray for all who serve as confessors and pastors. Give them your patience and love for souls, and give penitents the courage to seek mercy without fear. Amen.' },
  { id:'s26', category:'saint', title:'St. Padre Pio', author:'1887\u20131968, feast day September 23', tags:['stigmata','confession','italy'],
    content:'An Italian Capuchin friar who bore the visible wounds of Christ\u2019s stigmata for roughly fifty years, Padre Pio became one of the twentieth century\u2019s most sought-after spiritual figures, drawing enormous crowds to his monastery in San Giovanni Rotondo. He spent long hours each day hearing confessions and was reported by many to possess gifts of healing and spiritual insight.\n\nHe was canonized in 2002 and remains one of the most widely venerated saints of the modern era.',
    intercession:'St. Padre Pio, who bore the wounds of Christ, pray for us. Help us to unite our own sufferings to his, and to seek healing and mercy with the same trust you showed throughout your life. Amen.' },
  { id:'s27', category:'saint', title:'St. Maximilian Kolbe', author:'1894\u20131941, feast day August 14', tags:['martyr','charity','world war ii'],
    content:'A Polish Franciscan friar imprisoned at Auschwitz, Kolbe volunteered to die in place of a fellow prisoner, a husband and father, who had been selected for starvation as punishment for another inmate\u2019s escape. He led his fellow condemned prisoners in prayer during their final days and was ultimately killed by lethal injection.\n\nHe is honored as a martyr of charity, and the man he saved was present at his canonization in 1982.',
    intercession:'St. Maximilian Kolbe, martyr of charity, pray for us. Give us even a portion of your willingness to lay down our lives for another, and strengthen all who suffer persecution for their faith. Amen.' },
  { id:'s28', category:'saint', title:'St. Faustina Kowalska', author:'1905\u20131938, feast day October 5', tags:['divine mercy','visionary','poland'],
    content:'A Polish nun of humble background and little formal education, Faustina reported visions of Jesus who asked her to spread devotion to his Divine Mercy. Her spiritual diary, recorded at the direction of her confessors, became the foundation for the Divine Mercy devotion and image now found throughout the world.\n\nShe was canonized in 2000 by Pope John Paul II, her fellow Pole, who also established Divine Mercy Sunday on her recommendation.',
    intercession:'St. Faustina, apostle of Divine Mercy, pray for us. Help us to trust in Jesus as you did, and to carry his message of mercy to a world so often convinced it is beyond forgiveness. Amen.' },
  { id:'s29', category:'saint', title:'St. John Paul II', author:'1920\u20132005, feast day October 22', tags:['pope','poland','youth'],
    content:'Born Karol Wojtyła in Poland, he survived Nazi occupation and Communist rule before being elected pope in 1978, the first non-Italian pope in over four centuries. His nearly twenty-seven-year pontificate was marked by extensive world travel, a central role in the fall of Communism in Eastern Europe, and a particular closeness to young people through World Youth Day.\n\nHe survived an assassination attempt in 1981 and later personally forgave the man who shot him. He was canonized in 2014.',
    intercession:'St. John Paul II, pray for us. Give young people the courage you so often called for, to "be not afraid," and help all of us to forgive as freely as you forgave your own attacker. Amen.' },
  { id:'s30', category:'saint', title:'St. Teresa of Calcutta', author:'1910\u20131997, feast day September 5', tags:['charity','missionaries of charity','poor'],
    content:'Born Anjezë Gonxhe Bojaxhiu in what is now North Macedonia, Mother Teresa spent nearly two decades teaching before feeling called to serve "the poorest of the poor" on the streets of Calcutta. She founded the Missionaries of Charity, which grew into a worldwide order caring for the dying, the abandoned, and the destitute.\n\nHer later revealed private writings disclosed decades of profound spiritual darkness borne quietly alongside her public work. She was canonized in 2016.',
    intercession:'St. Teresa of Calcutta, pray for us. Teach us to see Christ in the poorest and most overlooked, and to keep serving faithfully even when, like you, we feel no consolation in our faith. Amen.' },
  { id:'s31', category:'saint', title:'St. Rita of Cascia', author:'1381\u20131457, feast day May 22', tags:['widows','difficult marriages','impossible causes'],
    content:'Married young to a violent and unfaithful husband, Rita endured an eighteen-year marriage before his death, and later lost both her sons as well. She then entered an Augustinian convent, where she lived a life of deep penance and, by tradition, received a wound on her forehead resembling a thorn from Christ\u2019s crown.\n\nShe is widely invoked as a patron of difficult marriages, widows, and seemingly impossible or hopeless situations.',
    intercession:'St. Rita of Cascia, patron of impossible causes, pray for us. You who bore great suffering within your own family, intercede for all in difficult marriages and troubled homes, that they may find peace. Amen.' },
  { id:'s32', category:'saint', title:'St. Bernadette Soubirous', author:'1844\u20131879, feast day April 16', tags:['visionary','lourdes','marian'],
    content:'A poor, sickly fourteen-year-old girl in Lourdes, France, Bernadette reported eighteen apparitions of a "beautiful lady" who identified herself as the Immaculate Conception, revealing a spring of water that became famous for reported healings. She endured intense scrutiny and skepticism from both civil and Church authorities before her visions were officially recognized.\n\nShe later entered religious life and asked to be forgotten, living quietly until her death from illness at thirty-five.',
    intercession:'St. Bernadette, humble seer of Lourdes, pray for the sick and for all who seek healing in body or spirit. Teach us your simplicity of faith before the mysteries God chooses to reveal. Amen.' },
  { id:'s33', category:'saint', title:'St. Catherine of Siena', author:'1347\u20131380, feast day April 29', tags:['doctor of the church','mystic','papacy'],
    content:'An Italian laywoman and Dominican tertiary, Catherine experienced profound mystical union with Christ from a young age and became an influential voice in Church affairs, most famously persuading Pope Gregory XI to return the papacy from Avignon to Rome. Unable to read or write until later in life, she dictated hundreds of letters and a major mystical work, The Dialogue.\n\nShe was declared a Doctor of the Church in 1970, alongside Teresa of Ávila.',
    intercession:'St. Catherine of Siena, pray for us. Give us your fearless honesty in speaking truth to those in authority, and your deep union of heart with Christ that made such courage possible. Amen.' },
  { id:'s34', category:'saint', title:'St. Elizabeth Ann Seton', author:'1774\u20131821, feast day January 4', tags:['convert','education','united states'],
    content:'A wealthy Episcopalian widow with five children, Elizabeth Ann Seton converted to Catholicism after encountering the faith in Italy, a decision that cost her much of her social standing and family support. She founded the Sisters of Charity of St. Joseph, establishing the first free Catholic school for girls in America and pioneering the American parochial school system.\n\nShe was canonized in 1975, the first person born in the United States to be declared a saint.',
    intercession:'St. Elizabeth Ann Seton, pray for us. Give widowed and single parents your resourcefulness and faith, and inspire Catholic educators to serve children with the same devotion you brought to your schools. Amen.' },
  { id:'s35', category:'saint', title:'St. Dominic', author:'1170\u20131221, feast day August 8', tags:['founder','dominicans','preaching'],
    content:'A Spanish priest troubled by the spread of heresy in southern France, Dominic founded the Order of Preachers, known as the Dominicans, dedicated to rigorous study and public preaching in defense of Catholic doctrine. He insisted his friars live in poverty so their preaching would be credible to those they hoped to reach.\n\nDevotion to the Rosary has long been associated with Dominic and his order, though the precise history of that connection is debated by historians.',
    intercession:'St. Dominic, father of preachers, pray for us. Give us a hunger for truth and the courage to speak it plainly, and help us to pray the Rosary with the depth your order has long taught. Amen.' },
  { id:'s36', category:'saint', title:'St. Vincent de Paul', author:'1581\u20131660, feast day September 27', tags:['charity','poor','founder'],
    content:'A French priest who once experienced enslavement himself before his ordination, Vincent de Paul devoted his life to organizing systematic care for the poor, the sick, and abandoned children, founding the Congregation of the Mission and, with St. Louise de Marillac, the Daughters of Charity. His approach professionalized and expanded Catholic charitable work well beyond his own lifetime.\n\nHis name is carried today by the worldwide Society of St. Vincent de Paul, which continues direct service to the poor.',
    intercession:'St. Vincent de Paul, pray for us. Give us your practical love for the poor, one that moves beyond good intentions into real, organized, patient service. Amen.' },
  { id:'s37', category:'saint', title:'St. Rose of Lima', author:'1586\u20131617, feast day August 23', tags:['penance','south america','first american saint'],
    content:'Born Isabel Flores de Oliva in Lima, Peru, Rose lived a life of intense penance and prayer while supporting her family through embroidery and gardening, resisting pressure to marry in order to consecrate her life to Christ. She cared for the sick and poor of her city from a small hermitage built in her family\u2019s garden.\n\nCanonized in 1671, she was the first person born in the Americas to be declared a saint.',
    intercession:'St. Rose of Lima, pray for us. Give young people facing pressure to abandon their calling the same firm resolve you showed, and a heart devoted to serving the poor of their own city. Amen.' },
  { id:'s38', category:'saint', title:'St. Martin de Porres', author:'1579\u20131639, feast day November 3', tags:['charity','racial reconciliation','peru'],
    content:'Born in Lima to a Spanish nobleman and a freed Black woman, Martin faced discrimination for his mixed heritage yet was admitted to the Dominican order, where he served as a lay brother caring for the sick, the poor, and even animals. He was known for extraordinary humility, insisting on the lowliest tasks despite reports of remarkable spiritual gifts.\n\nHe was canonized in 1962 and is honored as a patron of racial harmony and social justice.',
    intercession:'St. Martin de Porres, pray for us. Teach us your humility in choosing the lowest place, and your tender care for the sick, the poor, and all creatures, without regard for their standing in the eyes of the world. Amen.' },
  { id:'s39', category:'saint', title:'St. Kateri Tekakwitha', author:'1656\u20131680, feast day July 14', tags:['native american','purity','first north american saint'],
    content:'Born to a Mohawk father and Christian Algonquin mother in what is now New York State, Kateri survived smallpox as a child, which left her partially blind and scarred. She converted to Christianity as a young woman against significant opposition from her community, eventually fleeing to a Christian settlement in Canada, where she lived a life of intense prayer and penance until her death at twenty-four.\n\nShe was canonized in 2012, the first Native American to be declared a saint.',
    intercession:'St. Kateri Tekakwitha, Lily of the Mohawks, pray for us. Give indigenous peoples and converts facing opposition from their own communities the same courage and peace you found in following Christ. Amen.' },
  { id:'s40', category:'saint', title:'St. Michael the Archangel', author:'feast day September 29', tags:['angels','protection','spiritual warfare'],
    content:'Named in Scripture as "one of the chief princes" and the great protector who contends against the forces of evil, Michael appears in the Book of Daniel, the Letter of Jude, and the Book of Revelation, where he leads the heavenly hosts against the dragon. His name, meaning "Who is like God?", is understood as his answer to Satan\u2019s pride.\n\nHe is venerated as the protector of the Church and is traditionally invoked for defense against spiritual and physical danger.',

  { id:'s41', category:'saint', title:'St. Lucy', author:'283\u2013304, feast day December 13', tags:['martyr','eyesight','light'],
    content:'A young Christian woman in Syracuse, Sicily, Lucy had consecrated her virginity to God and used her dowry to aid the poor, refusing an arranged marriage. Denounced as a Christian during the persecution of Diocletian, she was tortured and killed after reportedly resisting attempts to move or defile her body.\n\nHer name, meaning "light," made her a natural patron for eyesight, and her feast falls near the winter solstice, historically celebrated with candlelit processions.',

  { id:'s42', category:'saint', title:'St. Agnes', author:'c. 291\u2013304, feast day January 21', tags:['martyr','purity','youth'],
    content:'A twelve- or thirteen-year-old girl of a noble Roman family, Agnes was martyred during the persecution of Diocletian after refusing marriage in order to remain consecrated to Christ. Ancient accounts describe her calm courage in the face of threats and execution, remarkable given her young age.\n\nShe became one of the most venerated virgin martyrs of the early Church, commemorated in the Roman Canon of the Mass to this day.',

  { id:'h1', category:'history', title:'The Council of Nicaea (325)', author:'', tags:['councils','early church','creed'],
    content:'Convened by the Emperor Constantine, the First Council of Nicaea was the first ecumenical council of the Christian Church. It was called primarily to address the Arian controversy, which questioned the divinity of Christ, and produced the original Nicene Creed affirming that the Son is "of one substance" with the Father.\n\nThe council also addressed questions of Church discipline and the dating of Easter, setting a precedent for resolving doctrinal disputes through gathered councils of bishops.' },
  { id:'h2', category:'history', title:'The Rule of St. Benedict and Western Monasticism', author:'c. 530', tags:['monasticism','medieval','benedict'],
    content:'St. Benedict of Nursia founded the monastery of Monte Cassino and wrote a Rule for monastic life balancing prayer, manual labor, and communal living under the motto ora et labora, "pray and work." The Rule\u2019s moderation and practicality made it the dominant model for Western monasticism for centuries.\n\nBenedictine monasteries became centers of learning, agriculture, and the preservation of classical and religious texts throughout the early medieval period, earning Benedict the title of patron of Europe.' },
  { id:'h3', category:'history', title:'The Great Schism of 1054', author:'', tags:['schism','orthodoxy','medieval'],
    content:'Long-building tensions between the Latin-speaking Church centered in Rome and the Greek-speaking Church centered in Constantinople came to a head in 1054, when mutual excommunications were exchanged between Pope Leo IX\u2019s legate and Patriarch Michael Cerularius. Disputes over papal authority, the filioque clause in the Creed, and liturgical practice underlay the break.\n\nThe schism formally divided Western (Roman Catholic) and Eastern (Orthodox) Christianity, a division that persists today despite ongoing dialogue toward reconciliation.' },
  { id:'h4', category:'history', title:'The Council of Trent (1545\u20131563)', author:'', tags:['councils','reformation','counter-reformation'],
    content:'Called in response to the Protestant Reformation, the Council of Trent met intermittently over eighteen years to clarify Catholic doctrine and reform Church discipline. It reaffirmed the seven sacraments, the authority of Scripture and Tradition together, and addressed abuses such as the sale of indulgences.\n\nTrent shaped Catholic identity and practice for the next four centuries, standardizing the liturgy in what became known as the Tridentine Mass.' },
  { id:'h5', category:'history', title:'The Second Vatican Council (1962\u20131965)', author:'', tags:['councils','modern era','liturgy'],
    content:'Convened by Pope John XXIII and concluded under Pope Paul VI, the Second Vatican Council was called to renew the Church\u2019s engagement with the modern world. It produced sixteen documents addressing the liturgy, the nature of the Church, religious freedom, and relations with other faiths.\n\nAmong its most visible effects was the reform of the liturgy, including the introduction of Mass celebrated in vernacular languages alongside Latin.' },

const entryListEl = document.getElementById('entryList');
const sectionTitleEl = document.getElementById('sectionTitle');
const sectionDescEl = document.getElementById('sectionDesc');

function excerptOf(text, len){
  if(!text) return '';
  const flat = text.replace(/\s+/g,' ').trim();
  return flat.length > len ? flat.slice(0, len).trim() + '…' : flat;
}

function updateCounts(){
  const counts = { all: library.length, prayer:0, saint:0, history:0, book:0 };
  library.forEach(e => { if(counts[e.category] !== undefined) counts[e.category]++; });
  Object.keys(counts).forEach(k => {
    const el = document.getElementById('count-' + k);
    if(el) el.textContent = counts[k];
  });
  const calEl = document.getElementById('count-calendar');
  if(calEl) calEl.textContent = CALENDAR_DATA.length;
}

function currentEntries(){
  let list = library;
  if(activeCategory !== 'all'){
    list = list.filter(e => e.category === activeCategory);
  }
  if(searchTerm.trim()){
    const t = searchTerm.trim().toLowerCase();
    list = list.filter(e =>
      (e.title||'').toLowerCase().includes(t) ||
      (e.author||'').toLowerCase().includes(t) ||
      (e.content||'').toLowerCase().includes(t) ||
      (e.intercession||'').toLowerCase().includes(t) ||
      (e.tags||[]).some(tag => tag.toLowerCase().includes(t))
    );
  }
  return list;
}

function currentCalendarItems(){
  if(!searchTerm.trim()) return CALENDAR_DATA;
  const t = searchTerm.trim().toLowerCase();
  return CALENDAR_DATA.filter(e =>
    (e.name||'').toLowerCase().includes(t) ||
    (e.note||'').toLowerCase().includes(t) ||
    (e.type||'').toLowerCase().includes(t)
  );
}

  updateCounts();

  if(activeCategory === 'calendar'){

  }

  const entries = currentEntries();
  entryListEl.innerHTML = '';

  if(entries.length === 0){
    const div = document.createElement('div');
    div.className = 'empty-state';
    div.innerHTML = searchTerm.trim()

    const clearBtn = document.getElementById('clearFromEmpty');

    return;
  }

  const colorVar = { prayer:'var(--wine)', saint:'var(--gold)', history:'var(--green)', book:'var(--indigo)' };

  entries.forEach(entry => {
    const row = document.createElement('div');
    row.className = 'entry-row';
    row.style.setProperty('--row-color', colorVar[entry.category] || 'var(--wine)');
    row.innerHTML = `
      <div class="row-top">

        <span class="cat-badge">${CAT_LABEL[entry.category] || entry.category}</span>

      ${entry.author ? `<div class="byline">${escapeHtml(entry.author)}</div>` : ''}

      ${(entry.tags && entry.tags.length) ? `<div class="tags">${entry.tags.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
    `;
    row.addEventListener('click', () => openReadModal(entry.id));
    entryListEl.appendChild(row);
  });
}

nction renderCalendar(){
  entryListEl.innerHTML = '';

  const items = currentCalendarItems();

  const legend = document.createElement('div');
  legend.className = 'cal-legend';
  legend.innerHTML = Object.entries(CAL_TYPE_COLOR).map(([type,color]) =>
    `<div class="item"><span class="dot" style="background:${color}"></span>${type}</div>`
  ).join('');
  entryListEl.appendChild(legend);

  if(items.length === 0){
    const div = document.createElement('div');
    div.className = 'empty-state';
    div.innerHTML = `Nothing here matches your search.<br><button class="btn" id="clearFromEmpty">Clear search</button>`;
    entryListEl.appendChild(div);
    document.getElementById('clearFromEmpty').addEventListener('click', () => { document.getElementById('searchInput').value=''; searchTerm=''; render(); });
    return;
  }

  const movable = items.filter(e => e.month === 0);
  const fixed = items.filter(e => e.month !== 0).sort((a,b) => a.month - b.month || a.day - b.day);

  function buildRow(entry, dateLabel){
    const row = document.createElement('div');
    row.className = 'cal-row';
    row.innerHTML = `
      <div class="cal-date">${dateLabel}</div>
      <div class="cal-dot" style="--row-color:${CAL_TYPE_COLOR[entry.type] || 'var(--wine)'}"></div>
      <div class="cal-body">
        <div class="cal-top">
          <div class="cal-name">${escapeHtml(entry.name)}</div>
          <div class="cal-type">${escapeHtml(entry.type)}</div>
        </div>
        <div class="cal-note">${escapeHtml(entry.note || '')}</div>
      </div>
    `;
    return row;
  }

  if(movable.length){
    const group = document.createElement('div');
    group.className = 'month-group';
    group.innerHTML = `<h3>Moveable dates & seasons</h3>`;
    movable.forEach(e => group.appendChild(buildRow(e, 'Varies')));
    entryListEl.appendChild(group);
  }

  let currentMonth = null;
  let group = null;
  fixed.forEach(e => {
    if(e.month !== currentMonth){
      currentMonth = e.month;
      group = document.createElement('div');
      group.className = 'month-group';
      group.innerHTML = `<h3>${MONTH_NAMES[currentMonth-1]}</h3>`;
      entryListEl.appendChild(group);
    }
    group.appendChild(buildRow(e, MONTH_NAMES[e.month-1].slice(0,3) + ' ' + e.day));
  });
}

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[m]));
}

const readOverlay = document.getElementById('readOverlay');
let currentReadId = null;

function openReadModal(id){
  const e = library.find(x => x.id === id);
  if(!e) return;
  currentReadId = id;
  document.getElementById('readCat').textContent = CAT_LABEL[e.category] || e.category;
  document.getElementById('readTitle').textContent = e.title;
  document.getElementById('readByline').textContent = e.author || '';
  document.getElementById('readByline').style.display = e.author ? 'block' : 'none';

  const paragraphs = (e.content || '').split(/\n\s*\n/).filter(Boolean);
  const bodyEl = document.getElementById('readBody');
  bodyEl.innerHTML = paragraphs.length
    ? paragraphs.map(p => `<p>${escapeHtml(p).replace(/\n/g,'<br>')}</p>`).join('')
    : '<p style="color:var(--ink-soft); font-style:italic;">No text has been added for this entry yet.</p>';

  let intercessionEl = document.getElementById('readIntercession');
  if(intercessionEl) intercessionEl.remove();
  if(e.intercession){
    intercessionEl = document.createElement('div');
    intercessionEl.id = 'readIntercession';
    intercessionEl.className = 'intercession-block';
    intercessionEl.innerHTML = `<h3>Prayer of Intercession</h3><p>${escapeHtml(e.intercession)}</p>`;
    bodyEl.insertAdjacentElement('afterend', intercessionEl);
  }

  const linkBox = document.getElementById('readLinkBox');
  
  linkBox.innerHTML = '';
  if(e.link || e.pdf){
    if(e.link) linkBox.innerHTML += `<a href="${escapeHtml(e.link)}" target="_blank" rel="noopener">View source / full text ↗</a>`;
    if(e.pdf){if(e.link) linkBox.innerHTML += ' | '; linkBox.innerHTML += `<a href="${escapeHtml(e.pdf)}" target="_blank" rel="noopener">Download PDF ↗</a>`;}
  }


  const tagsEl = document.getElementById('readTags');
  tagsEl.innerHTML = (e.tags||[]).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');

  readOverlay.classList.add('open');
}

function selectBead(num){if(num==='center'){currentRosaryBead=-1;}else{currentRosaryBead=parseInt(num);}if(currentRosaryBead>=0 && currentRosaryBead<=10){currentRosaryDecade=0;}else if(currentRosaryBead>=11 && currentRosaryBead<=21){currentRosaryDecade=1;currentRosaryBead-=11;}else if(currentRosaryBead>=22 && currentRosaryBead<=32){currentRosaryDecade=2;currentRosaryBead-=22;}else if(currentRosaryBead>=33 && currentRosaryBead<=43){currentRosaryDecade=3;currentRosaryBead-=33;}else if(currentRosaryBead>=44 && currentRosaryBead<=54){currentRosaryDecade=4;currentRosaryBead-=44;}updateRosaryDisplay();}
function updateRosaryDisplay(){const ms=ROSARY_MYSTERIES[currentRosaryMysterySet];const my=ms.mysteries[currentRosaryDecade];document.getElementById('rosaryMystery').textContent=my?my.num+'. '+my.title:'-';document.getElementById('rosaryDecade').textContent=currentRosaryDecade+1;document.getElementById('rosaryBead').textContent=currentRosaryBead;const pe=document.getElementById('rosaryPrayer');if(currentRosaryBead===-1){pe.textContent='Make the Sign of the Cross: In the name of the Father, and of the Son, and of the Holy Spirit. Amen.';}else if(currentRosaryBead===0){pe.textContent=ROSARY_PRAYERS.creed;}else if([10,21,32,43,54].includes(currentRosaryBead)){pe.textContent=ROSARY_PRAYERS.gloryBe+'\n\n'+ROSARY_PRAYERS.fatima;}else if(currentRosaryBead%11===0){pe.textContent=ROSARY_PRAYERS.ourFather+(my?'\n\nMeditate: '+my.title+'\nFruit: '+my.fruit:'');}else{pe.textContent=ROSARY_PRAYERS.hailMary+(my?'\n\nMeditate: '+my.title:'');}document.querySelectorAll('.bead').forEach(b=>b.classList.remove('active'));if(currentRosaryBead>=0 && currentRosaryBead<=54){document.querySelector('[onclick*="selectBead('+currentRosaryBead+')"]').classList.add('active');}}
function prevBead(){if(currentRosaryBead>0) selectBead(currentRosaryBead-1); else if(currentRosaryBead===-1) selectBead(0);}
function nextBead(){if(currentRosaryBead<10) selectBead(currentRosaryBead+1); else if(currentRosaryBead===10) selectBead(11); else if(currentRosaryBead<21) selectBead(currentRosaryBead+1); else if(currentRosaryBead===21) selectBead(22); else if(currentRosaryBead<32) selectBead(currentRosaryBead+1); else if(currentRosaryBead===32) selectBead(33); else if(currentRosaryBead<43) selectBead(currentRosaryBead+1); else if(currentRosaryBead===43) selectBead(44); else if(currentRosaryBead<54) selectBead(currentRosaryBead+1); else if(currentRosaryBead===54) selectBead(0);}
function resetRosary(){currentRosaryBead=0;currentRosaryDecade=0;updateRosaryDisplay();}
