    content:'Long-building tensions between the Latin-speaking Church centered in Rome and the Greek-speaking Church centered in Constantinople came to a head in 1054, when mutual excommunications were exchanged between Pope Leo IX\u2019s legate and Patriarch Michael Cerularius. Disputes over papal authority, the filioque clause in the Creed, and liturgical practice underlay the break.\n\nThe schism formally divided Western (Roman Catholic) and Eastern (Orthodox) Christianity, a division that persists today despite ongoing dialogue toward reconciliation.' },
  { id:'h4', category:'history', title:'The Council of Trent (1545\u20131563)', author:'', tags:['councils','reformation','counter-reformation'],
    content:'Called in response to the Protestant Reformation, the Council of Trent met intermittently over eighteen years to clarify Catholic doctrine and reform Church discipline. It reaffirmed the seven sacraments, the authority of Scripture and Tradition together, and addressed abuses such as the sale of indulgences.\n\nTrent shaped Catholic identity and practice for the next four centuries, standardizing the liturgy in what became known as the Tridentine Mass.' },
  { id:'h5', category:'history', title:'The Second Vatican Council (1962\u20131965)', author:'', tags:['councils','modern era','liturgy'],
    content:'Convened by Pope John XXIII and concluded under Pope Paul VI, the Second Vatican Council was called to renew the Church\u2019s engagement with the modern world. It produced sixteen documents addressing the liturgy, the nature of the Church, religious freedom, and relations with other faiths.\n\nAmong its most visible effects was the reform of the liturgy, including the introduction of Mass celebrated in vernacular languages alongside Latin.' },

  { id:'b1', category:'book', title:'Confessions', author:'St. Augustine of Hippo, c. 397\u2013400', tags:['classic','autobiography','theology'],
    content:'A landmark of Western literature, Confessions is Augustine\u2019s autobiographical account of his restless youth, his years among the Manicheans, and his conversion to Christianity, framed throughout as a prayer addressed directly to God. It is widely considered the first Western autobiography and remains a foundational text on grace, memory, and desire.',
    link:'https://www.gutenberg.org/ebooks/3296', notable:'"You have made us for yourself, O Lord, and our heart is restless until it rests in you."' },
  { id:'b2', category:'book', title:'The Imitation of Christ', author:'Thomas à Kempis, c. 1418\u20131427', tags:['classic','devotional','spirituality'],
    content:'A devotional handbook emphasizing humility, detachment from worldly concerns, and interior union with Christ. Composed of four books of short meditative chapters, it has been one of the most widely translated and read Christian texts after the Bible itself, shaping spiritual formation for over five centuries.',
    link:'https://www.gutenberg.org/ebooks/1653' },
  { id:'b3', category:'book', title:'Introduction to the Devout Life', author:'St. Francis de Sales, 1609', tags:['classic','laity','spirituality'],
    content:'Written for laypeople rather than clergy or religious, this work argues that a devout life is attainable within ordinary secular circumstances — in marriage, work, and daily routine. Its warm, practical tone made it enormously influential in shaping a spirituality accessible outside the monastery.',
    link:'https://www.gutenberg.org/ebooks/2716' },
  { id:'b4', category:'book', title:'Story of a Soul', author:'St. Thérèse of Lisieux, 1898', tags:['classic','autobiography','little way'],
    content:'The spiritual autobiography of St. Thérèse of Lisieux, compiled from manuscripts written at the request of her Carmelite superiors and published after her death. It presents her "Little Way" of spiritual childhood and has become one of the best-selling religious texts of the modern era.',
    link:'https://www.gutenberg.org/ebooks/23997' },
  { id:'b5', category:'book', title:'Summa Theologica', author:'St. Thomas Aquinas, 1265\u20131274', tags:['reference','philosophy','theology'],
    content:'An unfinished but monumental synthesis of Catholic theology, structured as a series of questions and articles addressing God, creation, morality, Christ, and the sacraments, each weighing objections against a reasoned response. It remains the central reference work of scholastic theology.',
    link:'https://www.newadvent.org/summa/' },
  { id:'b6', category:'book', title:'The Rule of St. Benedict', author:'St. Benedict of Nursia, c. 530', tags:['classic','monasticism','reference'],
    content:'A short, practical guide for monastic community life, balancing communal prayer, manual labor, and silence under the motto ora et labora, "pray and work." Its moderation and realism about human weakness made it the most influential monastic rule in Western history and a touchstone for Christian approaches to ordinary daily discipline.' },
  { id:'b7', category:'book', title:'The Interior Castle', author:'St. Teresa of Ávila, 1577', tags:['classic','mysticism','prayer'],
    content:'Teresa\u2019s mature masterwork on the life of prayer, picturing the soul as a crystal castle of seven "mansions" through which a person journeys toward union with God. Written for her fellow Carmelites, it remains one of the most studied maps of the interior spiritual life in the Christian tradition.' },
  { id:'b8', category:'book', title:'Dark Night of the Soul', author:'St. John of the Cross, c. 1584\u20131585', tags:['classic','mysticism','suffering'],
    content:'A commentary on John\u2019s own mystical poem, describing the painful but purifying passage through spiritual dryness and darkness on the way to deeper union with God. The phrase "dark night of the soul" entered common language from this work to describe any period of profound spiritual trial.' },

   STATE
   ========================================================= */
const library = SEED_DATA.concat(BIBLE_DATA);
let activeCategory = 'all';
let searchTerm = '';

/* =========================================================
   RENDERING
   ========================================================= */
const entryListEl = document.getElementById('entryList');
const sectionTitleEl = document.getElementById('sectionTitle');
const sectionDescEl = document.getElementById('sectionDesc');

function excerptOf(text, len){
  if(!text) return '';
  const flat = text.replace(/\s+/g,' ').trim();
  return flat.length > len ? flat.slice(0, len).trim() + '…' : flat;
}

function buildTodayPanel(){
  const today = new Date();
  const month = today.getMonth() + 1;
  const day = today.getDate();
  const matches = CALENDAR_DATA.filter(e => e.month === month && e.day === day);
  const panel = document.createElement('div');
  panel.className = 'today-panel';
  const dateStr = today.toLocaleDateString(undefined, { month:'long', day:'numeric' });
  if(matches.length){
    panel.innerHTML = `
      <div class="today-label">Today, ${escapeHtml(dateStr)}</div>
      ${matches.map(m => `<div class="today-item"><span class="today-dot" style="background:${CAL_TYPE_COLOR[m.type]||'var(--wine)'}"></span><strong>${escapeHtml(m.name)}</strong> <span class="today-type">(${escapeHtml(m.type)})</span></div>`).join('')}
    `;
  } else {
    panel.innerHTML = `<div class="today-label">Today, ${escapeHtml(dateStr)}</div><div class="today-item">No fixed feast on today\u2019s date \u2014 check the Calendar tab for moveable feasts and the current liturgical season.</div>`;
  }
  return panel;
}

const PATRON_FILTERS = [
  { label:'Travelers', term:'travelers' },
  { label:'Musicians', term:'musicians' },
  { label:'Mothers', term:'mothers' },
  { label:'Students', term:'students' },
  { label:'The Sick', term:'sick' },
  { label:'Difficult Marriages', term:'difficult marriages' },
  { label:'Impossible Causes', term:'impossible' },
  { label:'Immigrants', term:'immigrants' },
  { label:'Farmers', term:'farmers' },
  { label:'Priests', term:'priests' }
];

function buildPatronFilterRow(){
  const row = document.createElement('div');
  row.className = 'patron-filters';
  row.innerHTML = `<div class="patron-filters-label">Find a patron saint for:</div>
    <div class="patron-filters-row">${PATRON_FILTERS.map(f => `<button class="patron-chip" data-term="${escapeHtml(f.term)}">${escapeHtml(f.label)}</button>`).join('')}</div>`;
  row.querySelectorAll('.patron-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      searchTerm = btn.dataset.term;
      document.getElementById('searchInput').value = searchTerm;
      render();
    });
  });
  return row;
}

function updateCounts(){
  const counts = { all: library.length, prayer:0, saint:0, history:0, book:0, bible:0 };
  library.forEach(e => { if(counts[e.category] !== undefined) counts[e.category]++; });
  Object.keys(counts).forEach(k => {
    const el = document.getElementById('count-' + k);
    if(el) el.textContent = counts[k];
  });
  const calEl = document.getElementById('count-calendar');
  if(calEl) calEl.textContent = CALENDAR_DATA.length;
}

function currentEntries(){
  let list = library;
  if(activeCategory !== 'all'){
    list = list.filter(e => e.category === activeCategory);
  }
  if(searchTerm.trim()){
    const t = searchTerm.trim().toLowerCase();
    list = list.filter(e =>
      (e.title||'').toLowerCase().includes(t) ||
      (e.author||'').toLowerCase().includes(t) ||
      (e.content||'').toLowerCase().includes(t) ||
      (e.intercession||'').toLowerCase().includes(t) ||
      (e.tags||[]).some(tag => tag.toLowerCase().includes(t))
    );
  }
  return list;
}

function currentCalendarItems(){
  if(!searchTerm.trim()) return CALENDAR_DATA;
  const t = searchTerm.trim().toLowerCase();
  return CALENDAR_DATA.filter(e =>
    (e.name||'').toLowerCase().includes(t) ||
    (e.note||'').toLowerCase().includes(t) ||
    (e.type||'').toLowerCase().includes(t)
  );
}

function render(){
  updateCounts();

  if(searchTerm.trim()){
    sectionTitleEl.textContent = 'Search results';
    sectionDescEl.textContent = `Showing entries matching "${searchTerm.trim()}"`;
  } else {
    sectionTitleEl.textContent = activeCategory === 'all' ? 'All entries'
      : activeCategory === 'calendar' ? 'Calendar of Feasts & Observances'
      : activeCategory === 'rosary' ? 'The Holy Rosary'
      : activeCategory === 'shop' ? 'Catholic Shops'
      : activeCategory === 'stations' ? 'Stations of the Cross'
      : activeCategory === 'chaplet' ? 'Divine Mercy Chaplet'
      : CAT_LABEL[activeCategory] + 's';
    sectionDescEl.textContent = CAT_DESC[activeCategory];
  }

  if(activeCategory === 'calendar'){
    renderCalendar();
    return;
  }
  if(activeCategory === 'rosary'){
    renderRosary();
    return;
  }
  if(activeCategory === 'shop'){
    renderShop();
    return;
  }
  if(activeCategory === 'stations'){
    renderStations();
    return;
  }
  if(activeCategory === 'chaplet'){
    renderChaplet();
    return;
  }

  const entries = currentEntries();
  entryListEl.innerHTML = '';

  if(activeCategory === 'all' && !searchTerm.trim()){
    entryListEl.appendChild(buildTodayPanel());
  }
  if(activeCategory === 'saint' && !searchTerm.trim()){
    entryListEl.appendChild(buildPatronFilterRow());
  }

  if(entries.length === 0){
    const div = document.createElement('div');
    div.className = 'empty-state';
    div.innerHTML = searchTerm.trim()
      ? `Nothing here matches your search.<br><button class="btn" id="clearFromEmpty">Clear search</button>`
      : `This section is empty.`;
    entryListEl.appendChild(div);
    const clearBtn = document.getElementById('clearFromEmpty');
    if(clearBtn) clearBtn.addEventListener('click', () => { document.getElementById('searchInput').value=''; searchTerm=''; render(); });
    return;
  }

  const colorVar = { prayer:'var(--wine)', saint:'var(--gold)', history:'var(--green)', book:'var(--indigo)', bible:'var(--teal)' };

  entries.forEach(entry => {
    const row = document.createElement('div');
    row.className = 'entry-row';
    row.style.setProperty('--row-color', colorVar[entry.category] || 'var(--wine)');
    row.innerHTML = `
      <div class="row-top">
        <h3>${escapeHtml(entry.title)}</h3>
        <span class="cat-badge">${CAT_LABEL[entry.category] || entry.category}</span>
      </div>
      ${entry.author ? `<div class="byline">${escapeHtml(entry.author)}</div>` : ''}
      <div class="excerpt">${escapeHtml(excerptOf(entry.content, 190))}</div>
      ${(entry.tags && entry.tags.length) ? `<div class="tags">${entry.tags.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
    `;
    row.addEventListener('click', () => openReadModal(entry.id));
    entryListEl.appendChild(row);
  });
}

function renderCalendar(){
  entryListEl.innerHTML = '';

  const items = currentCalendarItems();

  const legend = document.createElement('div');
  legend.className = 'cal-legend';
  legend.innerHTML = Object.entries(CAL_TYPE_COLOR).map(([type,color]) =>
    `<div class="item"><span class="dot" style="background:${color}"></span>${type}</div>`
  ).join('');
  entryListEl.appendChild(legend);

  if(items.length === 0){
    const div = document.createElement('div');
    div.className = 'empty-state';
    div.innerHTML = `Nothing here matches your search.<br><button class="btn" id="clearFromEmpty">Clear search</button>`;
    entryListEl.appendChild(div);
    document.getElementById('clearFromEmpty').addEventListener('click', () => { document.getElementById('searchInput').value=''; searchTerm=''; render(); });
    return;
  }

  const movable = items.filter(e => e.month === 0);
  const fixed = items.filter(e => e.month !== 0).sort((a,b) => a.month - b.month || a.day - b.day);

  function buildRow(entry, dateLabel){
    const row = document.createElement('div');
    row.className = 'cal-row';
    row.innerHTML = `
      <div class="cal-date">${dateLabel}</div>
      <div class="cal-dot" style="--row-color:${CAL_TYPE_COLOR[entry.type] || 'var(--wine)'}"></div>
      <div class="cal-body">
        <div class="cal-top">
          <div class="cal-name">${escapeHtml(entry.name)}</div>
          <div class="cal-type">${escapeHtml(entry.type)}</div>
        </div>
        <div class="cal-note">${escapeHtml(entry.note || '')}</div>
      </div>
    `;
    return row;
  }

  if(movable.length){
    const group = document.createElement('div');
    group.className = 'month-group';
    group.innerHTML = `<h3>Moveable dates & seasons</h3>`;
    movable.forEach(e => group.appendChild(buildRow(e, 'Varies')));
    entryListEl.appendChild(group);
  }

  let currentMonth = null;
  let group = null;
  fixed.forEach(e => {
    if(e.month !== currentMonth){
      currentMonth = e.month;
      group = document.createElement('div');
      group.className = 'month-group';
      group.innerHTML = `<h3>${MONTH_NAMES[currentMonth-1]}</h3>`;
      entryListEl.appendChild(group);
    }
    group.appendChild(buildRow(e, MONTH_NAMES[e.month-1].slice(0,3) + ' ' + e.day));
  });
}

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[m]));
}

const MOON_ICON = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 1 0 10.5 10.5Z" fill="currentColor"/></svg>';

const themeToggleBtn = document.getElementById('themeToggle');

function currentTheme(){
  return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
}

function applyThemeIcon(){
  themeToggleBtn.innerHTML = currentTheme() === 'dark' ? SUN_ICON : MOON_ICON;
  themeToggleBtn.title = currentTheme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
}

themeToggleBtn.addEventListener('click', () => {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('sanctify.theme', next); }catch(e){}
  applyThemeIcon();
});

applyThemeIcon();

   ========================================================= */
document.getElementById('navList').addEventListener('click', e => {
  const btn = e.target.closest('.navlink');
  if(!btn) return;
  document.querySelectorAll('.navlink').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeCategory = btn.dataset.cat;
  searchTerm = '';
  document.getElementById('searchInput').value = '';
  render();
});

const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', () => { searchTerm = searchInput.value; render(); });
document.getElementById('searchClear').addEventListener('click', () => {
  searchInput.value=''; searchTerm=''; searchInput.focus(); render();
});

const readOverlay = document.getElementById('readOverlay');
let currentReadId = null;

function openReadModal(id){
  const e = library.find(x => x.id === id);
  if(!e) return;
  currentReadId = id;
  document.getElementById('readCat').textContent = CAT_LABEL[e.category] || e.category;
  document.getElementById('readTitle').textContent = e.title;
  document.getElementById('readByline').textContent = e.author || '';
  document.getElementById('readByline').style.display = e.author ? 'block' : 'none';

  const paragraphs = (e.content || '').split(/\n\s*\n/).filter(Boolean);
  const bodyEl = document.getElementById('readBody');
  bodyEl.innerHTML = paragraphs.length
    ? paragraphs.map(p => `<p>${escapeHtml(p).replace(/\n/g,'<br>')}</p>`).join('')
    : '<p style="color:var(--ink-soft); font-style:italic;">No text has been added for this entry yet.</p>';

  let intercessionEl = document.getElementById('readIntercession');
  if(intercessionEl) intercessionEl.remove();
  const staleNotable = document.getElementById('readNotable');
  if(staleNotable) staleNotable.remove();
  if(e.intercession){
    intercessionEl = document.createElement('div');
    intercessionEl.id = 'readIntercession';
    intercessionEl.className = 'intercession-block';
    intercessionEl.innerHTML = `<h3>Prayer of Intercession</h3><p>${escapeHtml(e.intercession)}</p>`;
    bodyEl.insertAdjacentElement('afterend', intercessionEl);
  }
  if(e.notable){
    const notableEl = document.createElement('div');
    notableEl.id = 'readNotable';
    notableEl.className = 'intercession-block';
    notableEl.innerHTML = `<h3>A Well-Known Line</h3><p>${escapeHtml(e.notable)}</p>`;
    (document.getElementById('readIntercession') || bodyEl).insertAdjacentElement('afterend', notableEl);
  }

  const linkBox = document.getElementById('readLinkBox');
  linkBox.innerHTML = e.link ? `<a href="${escapeHtml(e.link)}" target="_blank" rel="noopener">View source / full text ↗</a>` : '';

  const tagsEl = document.getElementById('readTags');
  tagsEl.innerHTML = (e.tags||[]).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');

  readOverlay.classList.add('open');
}

document.getElementById('readClose').addEventListener('click', () => readOverlay.classList.remove('open'));
readOverlay.addEventListener('click', e => { if(e.target === readOverlay) readOverlay.classList.remove('open'); });

/* =========================================================
   ROSARY
   ========================================================= */
const ROSARY_PRAYERS = {
  cross: 'In the name of the Father, and of the Son, and of the Holy Spirit. Amen.',
  creed: 'I believe in God, the Father almighty, Creator of heaven and earth, and in Jesus Christ, his only Son, our Lord, who was conceived by the Holy Spirit, born of the Virgin Mary, suffered under Pontius Pilate, was crucified, died and was buried; he descended into hell; on the third day he rose again from the dead; he ascended into heaven, and is seated at the right hand of God the Father almighty; from there he will come to judge the living and the dead.\n\nI believe in the Holy Spirit, the holy catholic Church, the communion of saints, the forgiveness of sins, the resurrection of the body, and life everlasting. Amen.',
  ourFather: 'Our Father, who art in heaven, hallowed be Thy name; Thy kingdom come; Thy will be done on earth as it is in heaven. Give us this day our daily bread; and forgive us our trespasses as we forgive those who trespass against us; and lead us not into temptation, but deliver us from evil. Amen.',
  hailMary: 'Hail Mary, full of grace, the Lord is with thee. Blessed art thou amongst women, and blessed is the fruit of thy womb, Jesus.\n\nHoly Mary, Mother of God, pray for us sinners, now and at the hour of our death. Amen.',
  gloryBe: 'Glory be to the Father, and to the Son, and to the Holy Spirit. As it was in the beginning, is now, and ever shall be, world without end. Amen.',
  fatima: 'O my Jesus, forgive us our sins, save us from the fires of hell, and lead all souls to Heaven, especially those in most need of Thy mercy.',
  hailHolyQueen: 'Hail, holy Queen, Mother of mercy, our life, our sweetness, and our hope. To thee do we cry, poor banished children of Eve; to thee do we send up our sighs, mourning and weeping in this valley of tears. Turn then, most gracious advocate, thine eyes of mercy toward us, and after this our exile, show unto us the blessed fruit of thy womb, Jesus. O clement, O loving, O sweet Virgin Mary.',
  closing: 'O God, whose only-begotten Son, by his life, death, and resurrection, has purchased for us the rewards of eternal life, grant, we beseech Thee, that meditating upon these mysteries of the most holy Rosary of the Blessed Virgin Mary, we may imitate what they contain and obtain what they promise. Through the same Christ our Lord. Amen.'
};

const MYSTERIES = {
  joyful: { name:'Joyful Mysteries', days:'Monday & Saturday', list:[
    { name:'The Annunciation', meditation:'The angel Gabriel announces to Mary that she will conceive the Son of God, and she freely offers her "yes." Fruit of the mystery: humility.' },
    { name:'The Visitation', meditation:'Mary hurries to visit her cousin Elizabeth, who greets her as the mother of the Lord. Fruit of the mystery: charity toward one\u2019s neighbor.' },
    { name:'The Nativity', meditation:'Christ is born in Bethlehem and laid in a manger among the poor. Fruit of the mystery: poverty of spirit and detachment from worldly things.' },
    { name:'The Presentation', meditation:'Mary and Joseph present the infant Jesus in the Temple, where the elder Simeon recognizes him as the promised Messiah. Fruit of the mystery: obedience.' },
    { name:'The Finding in the Temple', meditation:'After three anxious days, Mary and Joseph find the boy Jesus teaching among the elders in the Temple. Fruit of the mystery: joy in seeking and finding Christ.' }
  ]},
  sorrowful: { name:'Sorrowful Mysteries', days:'Tuesday & Friday', list:[
    { name:'The Agony in the Garden', meditation:'Jesus prays in Gethsemane in great anguish, accepting the Father\u2019s will even to the point of death. Fruit of the mystery: sorrow for sin.' },
    { name:'The Scourging at the Pillar', meditation:'Jesus is brutally whipped before his crucifixion. Fruit of the mystery: purity.' },
    { name:'The Crowning with Thorns', meditation:'Soldiers mock Jesus as a false king, pressing a crown of thorns into his head. Fruit of the mystery: courage.' },
    { name:'The Carrying of the Cross', meditation:'Jesus carries his cross toward Calvary, falling beneath its weight. Fruit of the mystery: patience.' },
    { name:'The Crucifixion', meditation:'Jesus dies on the cross for the salvation of the world. Fruit of the mystery: perseverance and self-denial.' }
  ]},
  glorious: { name:'Glorious Mysteries', days:'Wednesday & Sunday', list:[
    { name:'The Resurrection', meditation:'Jesus rises from the dead on the third day, conquering sin and death. Fruit of the mystery: faith.' },
    { name:'The Ascension', meditation:'Jesus ascends into heaven forty days after his Resurrection. Fruit of the mystery: hope and desire for heaven.' },
    { name:'The Descent of the Holy Spirit', meditation:'The Holy Spirit descends upon Mary and the apostles at Pentecost. Fruit of the mystery: wisdom and love of God.' },
    { name:'The Assumption', meditation:'Mary is taken up, body and soul, into heavenly glory. Fruit of the mystery: the grace of a happy death.' },
    { name:'The Coronation of Mary', meditation:'Mary is crowned Queen of Heaven and earth. Fruit of the mystery: trust in Mary\u2019s intercession.' }
  ]},
  luminous: { name:'Luminous Mysteries', days:'Thursday', list:[
    { name:'The Baptism of the Lord', meditation:'Jesus is baptized in the Jordan by John, and the Father\u2019s voice proclaims him beloved Son. Fruit of the mystery: openness to the Holy Spirit.' },
    { name:'The Wedding at Cana', meditation:'At Mary\u2019s request, Jesus performs his first public miracle, turning water into wine. Fruit of the mystery: trust in Mary\u2019s intercession.' },
    { name:'The Proclamation of the Kingdom', meditation:'Jesus preaches repentance and the coming of God\u2019s kingdom, calling all people to conversion. Fruit of the mystery: repentance and trust in God.' },
    { name:'The Transfiguration', meditation:'Jesus reveals his divine glory to Peter, James, and John on the mountain. Fruit of the mystery: desire for holiness.' },
    { name:'The Institution of the Eucharist', meditation:'At the Last Supper, Jesus gives his Body and Blood under the appearance of bread and wine. Fruit of the mystery: adoration and love for the Eucharist.' }
  ]}
};

function todaysMysterySet(){
  const map = {0:'glorious',1:'joyful',2:'sorrowful',3:'glorious',4:'luminous',5:'sorrowful',6:'joyful'};
  return map[new Date().getDay()];
}

let rosarySet = todaysMysterySet();
let rosarySequence = null;
let rosaryStep = 0;

function buildRosarySequence(setKey){
  const set = MYSTERIES[setKey];
  const seq = [];
  seq.push({ label:'Sign of the Cross', prayer:ROSARY_PRAYERS.cross });
  seq.push({ label:'Apostles\u2019 Creed', prayer:ROSARY_PRAYERS.creed });
  seq.push({ label:'Our Father', prayer:ROSARY_PRAYERS.ourFather });
  for(let i=1;i<=3;i++) seq.push({ label:`Hail Mary (${i} of 3, for Faith, Hope & Charity)`, prayer:ROSARY_PRAYERS.hailMary });
  seq.push({ label:'Glory Be', prayer:ROSARY_PRAYERS.gloryBe });

  set.list.forEach((mystery, idx) => {
    seq.push({ label:`Mystery ${idx+1}: ${mystery.name}`, meditation:mystery.meditation, decade:idx+1, isMystery:true });
    seq.push({ label:'Our Father', prayer:ROSARY_PRAYERS.ourFather, decade:idx+1 });
    for(let j=1;j<=10;j++) seq.push({ label:'Hail Mary', prayer:ROSARY_PRAYERS.hailMary, decade:idx+1, bead:j });
    seq.push({ label:'Glory Be', prayer:ROSARY_PRAYERS.gloryBe, decade:idx+1 });
    seq.push({ label:'O My Jesus (Fatima Prayer)', prayer:ROSARY_PRAYERS.fatima, decade:idx+1 });
  });

  seq.push({ label:'Hail, Holy Queen', prayer:ROSARY_PRAYERS.hailHolyQueen });
  seq.push({ label:'Closing Prayer', prayer:ROSARY_PRAYERS.closing });
  return seq;
}

function renderRosary(){
  entryListEl.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'rosary-wrap';

  if(!rosarySequence){
    wrap.innerHTML = `
      <p class="rosary-intro">Choose which set of mysteries to pray. Traditionally: Joyful (Mon & Sat), Sorrowful (Tue & Fri), Glorious (Wed & Sun), Luminous (Thu).</p>
      <div class="rosary-mystery-select">
        ${Object.keys(MYSTERIES).map(key => `<button class="rosary-mystery-btn ${key===rosarySet?'active':''}" data-set="${key}">${MYSTERIES[key].name}</button>`).join('')}
      </div>
      <div class="rosary-suggestion">Today\u2019s traditional mysteries: ${MYSTERIES[todaysMysterySet()].name}</div>
      <button class="btn primary" id="rosaryBeginBtn">Begin praying</button>
    `;
    entryListEl.appendChild(wrap);
    wrap.querySelectorAll('.rosary-mystery-btn').forEach(btn => {
      btn.addEventListener('click', () => { rosarySet = btn.dataset.set; renderRosary(); });
    });
    document.getElementById('rosaryBeginBtn').addEventListener('click', () => {
      rosarySequence = buildRosarySequence(rosarySet);
      rosaryStep = 0;
      renderRosary();
    });
    return;
  }

  const step = rosarySequence[rosaryStep];
  const total = rosarySequence.length;

  let beadsHtml = '';
  if(step.decade){
    const dots = [];
    for(let j=1;j<=10;j++){
      const cls = ['rosary-bead'];
      if(step.bead && j <= step.bead) cls.push('filled');
      if(step.bead === j) cls.push('current');
      dots.push(`<span class="${cls.join(' ')}"></span>`);
    }
    beadsHtml = `<div class="rosary-beads">${dots.join('')}</div>`;
  }

  wrap.innerHTML = `
    <div class="rosary-stage">
      <div class="step-meta">${MYSTERIES[rosarySet].name}${step.decade ? ' \u00b7 Decade ' + step.decade + ' of 5' : ''}</div>
      <div class="step-label">${escapeHtml(step.label)}</div>
      ${step.isMystery ? `<div class="step-prayer">${escapeHtml(step.meditation)}</div>` : `<div class="step-prayer">${escapeHtml(step.prayer).replace(/\n/g,'<br><br>')}</div>`}
      ${beadsHtml}
    </div>
    <div class="rosary-nav">
      <button class="btn" id="rosaryBackBtn" ${rosaryStep===0?'disabled':''}>Back</button>
      <button class="btn primary" id="rosaryNextBtn">${rosaryStep === total-1 ? 'Finish' : 'Next'}</button>
    </div>
    <div class="rosary-progress">Step ${rosaryStep+1} of ${total}</div>
    <div class="rosary-restart"><button class="btn quiet" id="rosaryRestartBtn">Choose different mysteries</button></div>
  `;
  entryListEl.appendChild(wrap);

  const backBtn = document.getElementById('rosaryBackBtn');
  if(backBtn) backBtn.addEventListener('click', () => { if(rosaryStep>0){ rosaryStep--; renderRosary(); } });

  document.getElementById('rosaryNextBtn').addEventListener('click', () => {
    if(rosaryStep < total-1){ rosaryStep++; renderRosary(); }
    else { rosarySequence = null; rosaryStep = 0; renderRosary(); }
  });
  document.getElementById('rosaryRestartBtn').addEventListener('click', () => {
    rosarySequence = null; rosaryStep = 0; renderRosary();
  });
}

   STATIONS OF THE CROSS
   ========================================================= */
const STATIONS_VERSICLE = { v:'We adore You, O Christ, and we bless You,', r:'because by Your holy cross You have redeemed the world.' };
const STATIONS_DATA = [
  { title:'Jesus is Condemned to Death', meditation:'Pilate washes his hands of responsibility and hands Jesus over to be crucified, though he finds no guilt in him. We consider how often we stay silent in the face of injustice simply to avoid discomfort.' },
  { title:'Jesus Carries His Cross', meditation:'Jesus accepts the instrument of his own execution and begins the long walk to Calvary. We ask for the grace to accept the crosses of our own lives without bitterness.' },
  { title:'Jesus Falls the First Time', meditation:'Weakened by scourging and loss of blood, Jesus falls beneath the weight of the cross. We remember that even Christ stumbled, and ask for compassion toward our own weakness and that of others.' },
  { title:'Jesus Meets His Mother', meditation:'Along the road, Jesus encounters Mary, who shares silently in his suffering. We ask Mary to accompany us in our own sorrows as she accompanied her son.' },
  { title:'Simon of Cyrene Helps Jesus Carry the Cross', meditation:'A passerby is compelled to help Jesus bear the cross. We pray for the willingness to help carry the burdens of others, even ones we did not choose.' },
  { title:'Veronica Wipes the Face of Jesus', meditation:'By tradition, a woman steps forward to wipe the face of Jesus. We ask for the courage to offer small mercies even amid a hostile crowd.' },
  { title:'Jesus Falls the Second Time', meditation:'Jesus falls again under the cross\u2019s weight. We consider how repeated failure need not mean abandoning the journey, only rising again.' },
  { title:'Jesus Meets the Women of Jerusalem', meditation:'Jesus tells the weeping women not to weep for him but for themselves and their children. True compassion, he reminds us, looks honestly at our own need for conversion.' },
  { title:'Jesus Falls the Third Time', meditation:'A final fall, nearest to Calvary, where exhaustion is nearly complete. We ask for perseverance in the last, hardest steps of any difficult path.' },
  { title:'Jesus is Stripped of His Garments', meditation:'Jesus is stripped in public humiliation before his execution. We consider the call to strip away pride and attachment to worldly things.' },
  { title:'Jesus is Nailed to the Cross', meditation:'Jesus is nailed to the wood and raised up between two criminals. We meditate on a suffering willingly accepted for love of us.' },
  { title:'Jesus Dies on the Cross', meditation:'Jesus commends his spirit to the Father and dies. We pause in silence before the mystery of a God who dies for his creation.' },
  { title:'Jesus is Taken Down from the Cross', meditation:'Jesus\u2019 body is removed and placed in the arms of his grieving mother. We ask Mary to receive our own sorrows as she once received her son\u2019s body.' },
  { title:'Jesus is Laid in the Tomb', meditation:'Jesus is laid in the tomb, and the stone is rolled shut. We wait in the stillness of Holy Saturday, trusting in the resurrection still to come.' }
];

let stationsStep = null;

function renderStations(){
  entryListEl.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'rosary-wrap';

  if(stationsStep === null){
    wrap.innerHTML = `
      <p class="rosary-intro">Walk through the fourteen Stations of the Cross, traditionally prayed on Fridays and especially during Lent. Each station pairs a moment of Christ\u2019s Passion with a short meditation.</p>
      <button class="btn primary" id="stationsBeginBtn">Begin</button>
    `;
    entryListEl.appendChild(wrap);
    document.getElementById('stationsBeginBtn').addEventListener('click', () => { stationsStep = 0; renderStations(); });
    return;
  }

  const s = STATIONS_DATA[stationsStep];
  const total = STATIONS_DATA.length;
  wrap.innerHTML = `
    <div class="rosary-stage">
      <div class="step-meta">Station ${stationsStep+1} of ${total}</div>
      <div class="step-label">${escapeHtml(s.title)}</div>
      <div class="step-prayer">${escapeHtml(s.meditation)}</div>
      <div class="step-prayer" style="margin-top:16px; font-style:italic;">${escapeHtml(STATIONS_VERSICLE.v)}<br>${escapeHtml(STATIONS_VERSICLE.r)}</div>
    </div>
    <div class="rosary-nav">
      <button class="btn" id="stationsBackBtn" ${stationsStep===0?'disabled':''}>Back</button>
      <button class="btn primary" id="stationsNextBtn">${stationsStep === total-1 ? 'Finish' : 'Next'}</button>
    </div>
    <div class="rosary-progress">Station ${stationsStep+1} of ${total}</div>
    <div class="rosary-restart"><button class="btn quiet" id="stationsRestartBtn">Start over</button></div>
  `;
  entryListEl.appendChild(wrap);

  const backBtn = document.getElementById('stationsBackBtn');
  if(backBtn) backBtn.addEventListener('click', () => { if(stationsStep>0){ stationsStep--; renderStations(); } });
  document.getElementById('stationsNextBtn').addEventListener('click', () => {
    if(stationsStep < total-1){ stationsStep++; renderStations(); }
    else { stationsStep = null; renderStations(); }
  });
  document.getElementById('stationsRestartBtn').addEventListener('click', () => { stationsStep = null; renderStations(); });

   ========================================================= */
const CHAPLET_PRAYERS = {
  opening: 'You expired, Jesus, but the source of life gushed forth for souls, and an ocean of mercy opened up for the whole world. O Fount of Life, unfathomable Divine Mercy, envelop the whole world and empty Yourself out upon us.',
  eternalFather: 'Eternal Father, I offer You the Body and Blood, Soul and Divinity of Your dearly beloved Son, Our Lord Jesus Christ, in atonement for our sins and those of the whole world.',
  forTheSake: 'For the sake of His sorrowful Passion, have mercy on us and on the whole world.',
  holyGod: 'Holy God, Holy Mighty One, Holy Immortal One, have mercy on us and on the whole world.',
  closing: 'Eternal God, in whom mercy is endless and the treasury of compassion inexhaustible, look kindly upon us and increase Your mercy in us, that in difficult moments we might not despair nor become despondent, but with great confidence submit ourselves to Your holy will, which is Love and Mercy itself.'
};

let chapletSequence = null;
let chapletStep = 0;

function buildChapletSequence(){
  const seq = [];
  seq.push({ label:'Sign of the Cross', prayer:ROSARY_PRAYERS.cross });
  seq.push({ label:'Opening', prayer:CHAPLET_PRAYERS.opening });
  seq.push({ label:'Our Father', prayer:ROSARY_PRAYERS.ourFather });
  seq.push({ label:'Hail Mary', prayer:ROSARY_PRAYERS.hailMary });
  seq.push({ label:'Apostles\u2019 Creed', prayer:ROSARY_PRAYERS.creed });
  for(let d=1; d<=5; d++){
    seq.push({ label:'Eternal Father', prayer:CHAPLET_PRAYERS.eternalFather, decade:d });
    for(let j=1; j<=10; j++) seq.push({ label:'For the Sake of His Sorrowful Passion', prayer:CHAPLET_PRAYERS.forTheSake, decade:d, bead:j });
  }
  for(let k=1; k<=3; k++) seq.push({ label:`Holy God (${k} of 3)`, prayer:CHAPLET_PRAYERS.holyGod });
  seq.push({ label:'Closing Prayer', prayer:CHAPLET_PRAYERS.closing });
  return seq;
}

function renderChaplet(){
  entryListEl.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'rosary-wrap';

  if(!chapletSequence){
    wrap.innerHTML = `
      <p class="rosary-intro">The Chaplet of Divine Mercy, given by Christ to St. Faustina Kowalska, is traditionally prayed on rosary beads, especially at 3:00 pm, the "Hour of Mercy."</p>
      <button class="btn primary" id="chapletBeginBtn">Begin praying</button>
    `;
    entryListEl.appendChild(wrap);

      chapletSequence = buildChapletSequence(); chapletStep = 0; renderChaplet();
    });

  }

  const step = chapletSequence[chapletStep];
  const total = chapletSequence.length;
  let beadsHtml = '';
  if(step.decade){
    const dots = [];
    for(let j=1;j<=10;j++){
      const cls = ['rosary-bead'];
      if(step.bead && j <= step.bead) cls.push('filled');
      if(step.bead === j) cls.push('current');
      dots.push(`<span class="${cls.join(' ')}"></span>`);
    }
    beadsHtml = `<div class="rosary-beads">${dots.join('')}</div>`;
  }

  wrap.innerHTML = `
    <div class="rosary-stage">
      <div class="step-meta">${step.decade ? 'Decade ' + step.decade + ' of 5' : 'Divine Mercy Chaplet'}</div>
      <div class="step-label">${escapeHtml(step.label)}</div>
      <div class="step-prayer">${escapeHtml(step.prayer)}</div>
      ${beadsHtml}
    </div>
    <div class="rosary-nav">
      <button class="btn" id="chapletBackBtn" ${chapletStep===0?'disabled':''}>Back</button>
      <button class="btn primary" id="chapletNextBtn">${chapletStep === total-1 ? 'Finish' : 'Next'}</button>
    </div>
    <div class="rosary-progress">Step ${chapletStep+1} of ${total}</div>
    <div class="rosary-restart"><button class="btn quiet" id="chapletRestartBtn">Start over</button></div>
  `;
  entryListEl.appendChild(wrap);

  const backBtn = document.getElementById('chapletBackBtn');
  if(backBtn) backBtn.addEventListener('click', () => { if(chapletStep>0){ chapletStep--; renderChaplet(); } });
  document.getElementById('chapletNextBtn').addEventListener('click', () => {
    if(chapletStep < total-1){ chapletStep++; renderChaplet(); }
    else { chapletSequence = null; chapletStep = 0; renderChaplet(); }
  });
  document.getElementById('chapletRestartBtn').addEventListener('click', () => { chapletSequence = null; chapletStep = 0; renderChaplet(); });
}
